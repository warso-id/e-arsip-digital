<body>
    <!-- ... (existing body structure remains the same until scripts) ... -->
    
    <!-- Scripts -->
    <script src="../../config/config.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    
    <script>
    (function() {
        'use strict';
        
        // ============================================
        // SECURITY: CSRF TOKEN (with rotation)
        // ============================================
        var csrfToken = (function() {
            var t = localStorage.getItem('csrf_token');
            if (!t || Date.now() - (parseInt(localStorage.getItem('csrf_token_ts')||'0')) > 3600000) {
                var a = new Uint32Array(8);
                crypto.getRandomValues(a);
                t = Array.from(a, function(d) { return ('0'+d.toString(16)).slice(-2); }).join('');
                localStorage.setItem('csrf_token', t);
                localStorage.setItem('csrf_token_ts', Date.now().toString());
            }
            return t;
        })();
        
        function sanitize(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function sanitizePlain(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        
        // ============================================
        // STATE
        // ============================================
        var state = {
            data: [], stats: {},
            page: 1, limit: 20, totalPages: 1, totalItems: 0,
            isOnline: navigator.onLine,
            isLoading: false,
            loadError: null,
            retryCount: 0,
            maxRetries: 3
        };
        
        // ============================================
        // AUTH CHECK
        // ============================================
        function checkAuth() {
            if (window.EArsip && window.EArsip.Auth && window.EArsip.Auth.isAuthenticated) return true;
            try { var s = localStorage.getItem('auth_session'); if (s) { var d = JSON.parse(s); if (d.user && d.expiresAt && Date.now() < d.expiresAt) return true; } } catch(e) {}
            window.location.href = '../../login.html?message=unauthorized'; return false;
        }
        
        // ============================================
        // TOAST
        // ============================================
        function showToast(m, t) {
            var c = document.getElementById('toast-container'); if (!c) return;
            var el = document.createElement('div');
            el.className = 'toast toast-'+(t||'info');
            el.textContent = sanitizePlain(m);
            el.setAttribute('role', 'alert');
            c.appendChild(el);
            setTimeout(function() { el.style.opacity='0'; el.style.transition='opacity 0.3s'; setTimeout(function() { el.remove(); }, 300); }, 4000);
        }
        
        // ============================================
        // FORMAT
        // ============================================
        function formatDate(s) { if (!s) return '-'; try { var d = new Date(s); if (isNaN(d.getTime())) return s; return d.toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' }); } catch(e) { return s; } }
        
        // ============================================
        // NETWORK
        // ============================================
        function updateNetwork(online) {
            if (online === state.isOnline) return;
            state.isOnline = online;
            var bar = document.getElementById('network-bar');
            if (!online) {
                bar.className = 'network-bar offline';
                document.getElementById('network-msg').textContent = 'Anda sedang offline. Data mungkin tidak terbaru.';
            } else {
                bar.className = 'network-bar restored';
                document.getElementById('network-msg').textContent = 'Koneksi pulih! Menyegarkan data...';
                state.retryCount = 0; // Reset retry
                loadData();
            }
        }
        window.addEventListener('online', function() { updateNetwork(true); });
        window.addEventListener('offline', function() { updateNetwork(false); });
        if (!navigator.onLine) setTimeout(function() { updateNetwork(false); }, 1000);
        
        // ============================================
        // DEBOUNCE
        // ============================================
        function debounce(fn, ms) { var t; return function() { clearTimeout(t); t = setTimeout(fn, ms); }; }
        
        // ============================================
        // MONTH NAMES
        // ============================================
        var monthNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
        
        // ============================================
        // POPULATE FILTERS
        // ============================================
        function populateFilters() {
            var now = new Date();
            var bulanSelect = document.getElementById('filter-bulan');
            bulanSelect.innerHTML = monthNames.map(function(m, i) { return '<option value="'+(i+1)+'">'+m+'</option>'; }).join('');
            bulanSelect.value = now.getMonth() + 1;
            
            var tahunSelect = document.getElementById('filter-tahun');
            tahunSelect.innerHTML = '';
            var currentYear = now.getFullYear();
            for (var y = currentYear; y >= currentYear - 5; y--) {
                tahunSelect.innerHTML += '<option value="'+y+'">'+y+'</option>';
            }
            tahunSelect.value = currentYear;
        }
        
        // ============================================
        // SHOW LOADING SKELETON
        // ============================================
        function showSkeleton() {
            var tbody = document.getElementById('agenda-tbody');
            var rows = 5;
            var cols = 9;
            var html = '';
            for (var i = 0; i < rows; i++) {
                html += '<tr class="skeleton-row">';
                for (var j = 0; j < cols; j++) {
                    html += '<td><div class="skeleton" style="width:' + (60 + Math.random() * 40) + '%;"></div></td>';
                }
                html += '</tr>';
            }
            tbody.innerHTML = html;
        }
        
        // ============================================
        // LOAD DATA (with retry)
        // ============================================
        function loadData() {
            if (state.isLoading) return;
            state.isLoading = true;
            state.loadError = null;
            
            var bulan = document.getElementById('filter-bulan').value;
            var tahun = document.getElementById('filter-tahun').value;
            var sumber = document.getElementById('filter-sumber').value;
            var search = document.getElementById('search-input').value.trim();
            
            document.getElementById('periode-label').textContent = monthNames[parseInt(bulan)-1] + ' ' + tahun;
            
            // Show skeleton loading
            showSkeleton();
            
            var params = {
                action: 'getAgenda',
                bulan: bulan,
                tahun: tahun,
                page: state.page,
                limit: state.limit,
                search: search,
                sumber: sumber,
                csrf_token: csrfToken
            };
            
            var apiPromise;
            
            if (window.EArsip && window.EArsip.Api) {
                apiPromise = window.EArsip.Api.get('surat-masuk/agenda', params);
            } else {
                apiPromise = Promise.reject(new Error('API not available'));
            }
            
            apiPromise
                .then(function(r) {
                    state.isLoading = false;
                    state.retryCount = 0;
                    
                    if (r && r.data) {
                        state.data = r.data.surat || [];
                        state.stats = r.data.stats || {};
                        state.totalPages = r.data.totalPages || 1;
                        state.totalItems = r.data.total || state.data.length;
                    } else {
                        state.data = [];
                        state.stats = {};
                        state.totalPages = 1;
                        state.totalItems = 0;
                    }
                    render();
                })
                .catch(function(err) {
                    console.warn('Load error:', err);
                    state.isLoading = false;
                    state.loadError = err;
                    
                    if (state.retryCount < state.maxRetries) {
                        state.retryCount++;
                        showToast('Gagal memuat. Mencoba ulang (' + state.retryCount + '/' + state.maxRetries + ')...', 'info');
                        setTimeout(loadData, 1000 * state.retryCount); // Exponential backoff
                    } else {
                        // Fallback to sample data
                        loadSampleData();
                        showToast('Menggunakan data offline', 'info');
                    }
                });
        }
        
        function loadSampleData() {
            var bulan = parseInt(document.getElementById('filter-bulan').value);
            var tahun = parseInt(document.getElementById('filter-tahun').value);
            var pad = String(bulan).padStart(2, '0');
            
            var sample = [
                { id:'SM001', tgl_terima:tahun+'-'+pad+'-01', tgl_surat:tahun+'-'+pad+'-01', nomor_surat:'001/UND/'+pad+'/'+tahun, pengirim:'Kemendikbud', perihal:'Undangan Workshop Nasional', disposisi:'Wadek I', keterangan:'-', sumber:'eksternal' },
                { id:'SM002', tgl_terima:tahun+'-'+pad+'-03', tgl_surat:tahun+'-'+pad+'-01', nomor_surat:'B-456/UN/'+tahun, pengirim:'Rektorat', perihal:'Edaran Akademik', disposisi:'Semua Unit', keterangan:'Segera', sumber:'internal' },
                { id:'SM003', tgl_terima:tahun+'-'+pad+'-07', tgl_surat:tahun+'-'+pad+'-05', nomor_surat:'089/KER/'+pad+'/'+tahun, pengirim:'PT. Teknologi Nusantara', perihal:'Kerjasama Penelitian', disposisi:'Dekan', keterangan:'Penting', sumber:'eksternal' },
                { id:'SM004', tgl_terima:tahun+'-'+pad+'-10', tgl_surat:tahun+'-'+pad+'-08', nomor_surat:'045/SK/'+pad+'/'+tahun, pengirim:'BAUK', perihal:'SK Pengangkatan Staf', disposisi:'-', keterangan:'Arsip', sumber:'internal' },
                { id:'SM005', tgl_terima:tahun+'-'+pad+'-15', tgl_surat:tahun+'-'+pad+'-12', nomor_surat:'112/PEM/'+pad+'/'+tahun, pengirim:'Dinas Pendidikan', perihal:'Pemberitahuan Akreditasi', disposisi:'Kaprodi', keterangan:'-', sumber:'eksternal' },
                { id:'SM006', tgl_terima:tahun+'-'+pad+'-18', tgl_surat:tahun+'-'+pad+'-16', nomor_surat:'134/KEU/'+pad+'/'+tahun, pengirim:'BAUK', perihal:'Laporan Keuangan', disposisi:'Wadek II', keterangan:'-', sumber:'internal' }
            ];
            
            var search = document.getElementById('search-input').value.trim().toLowerCase();
            var sumber = document.getElementById('filter-sumber').value;
            
            if (search) sample = sample.filter(function(s) { return (s.nomor_surat||'').toLowerCase().indexOf(search)!==-1 || (s.pengirim||'').toLowerCase().indexOf(search)!==-1 || (s.perihal||'').toLowerCase().indexOf(search)!==-1; });
            if (sumber) sample = sample.filter(function(s) { return s.sumber === sumber; });
            
            state.data = sample;
            state.stats = {
                total: sample.length,
                internal: sample.filter(function(s){return s.sumber==='internal';}).length,
                eksternal: sample.filter(function(s){return s.sumber==='eksternal';}).length,
                disposisi: sample.filter(function(s){return s.disposisi&&s.disposisi!=='-';}).length,
                bulanIni: sample.length
            };
            state.totalPages = 1;
            state.totalItems = sample.length;
            state.isLoading = false;
            render();
        }
        
        // ============================================
        // RENDER
        // ============================================
        function render() {
            // Stats
            document.getElementById('stat-total').textContent = (state.stats.total || 0).toLocaleString('id-ID');
            document.getElementById('stat-internal').textContent = (state.stats.internal || 0).toLocaleString('id-ID');
            document.getElementById('stat-eksternal').textContent = (state.stats.eksternal || 0).toLocaleString('id-ID');
            document.getElementById('stat-disposisi').textContent = (state.stats.disposisi || 0).toLocaleString('id-ID');
            document.getElementById('stat-bulan-ini').textContent = (state.stats.bulanIni || state.data.length).toLocaleString('id-ID');
            
            var tbody = document.getElementById('agenda-tbody');
            
            if (state.loadError && state.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9"><div class="retry-container">' +
                    '<i class="fas fa-exclamation-circle" style="font-size:32px;color:#d97706;display:block;margin-bottom:8px;"></i>' +
                    '<p>Gagal memuat data dari server</p>' +
                    '<button class="btn btn-outline btn-sm" onclick="window._retryLoad()"><i class="fas fa-redo"></i> Coba Lagi</button>' +
                '</div></td></tr>';
                document.getElementById('pagination').innerHTML = '';
                document.getElementById('table-info').textContent = 'Gagal memuat';
                return;
            }
            
            if (state.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state">' +
                    '<i class="fas fa-book-open"></i>' +
                    '<p style="font-size:15px;font-weight:500;">Tidak ada data surat</p>' +
                    '<p style="font-size:13px;">Untuk periode ' + document.getElementById('periode-label').textContent + '</p>' +
                '</div></td></tr>';
                document.getElementById('pagination').innerHTML = '';
                document.getElementById('table-info').textContent = 'Tidak ada data';
                return;
            }
            
            tbody.innerHTML = state.data.map(function(s, i) {
                var rowNum = (state.page - 1) * state.limit + i + 1;
                return '<tr>' +
                    '<td>' + rowNum + '</td>' +
                    '<td>' + formatDate(s.tgl_terima) + '</td>' +
                    '<td>' + formatDate(s.tgl_surat) + '</td>' +
                    '<td><strong>' + sanitize(s.nomor_surat || '-') + '</strong></td>' +
                    '<td class="text-left">' + sanitize(s.pengirim || '-') + '</td>' +
                    '<td class="text-left">' + sanitize(s.perihal || '-') + '</td>' +
                    '<td><span class="badge" style="font-size:10px;padding:2px 8px;border-radius:10px;background:' + (s.disposisi && s.disposisi !== '-' ? '#dcfce7' : '#f1f5f9') + ';color:' + (s.disposisi && s.disposisi !== '-' ? '#16a34a' : '#94a3b8') + ';">' + sanitize(s.disposisi || 'Belum') + '</span></td>' +
                    '<td>' + sanitize(s.keterangan || '-') + '</td>' +
                    '<td class="no-print"><div style="display:flex;gap:4px;justify-content:center;">' +
                        '<a href="detail.html?id=' + sanitizePlain(s.id) + '" class="btn btn-sm btn-ghost" title="Lihat detail" aria-label="Detail surat ' + sanitizePlain(s.nomor_surat||'') + '"><i class="fas fa-eye"></i></a>' +
                        (s.disposisi && s.disposisi !== '-' ? '<a href="disposisi-cetak.html?id=' + sanitizePlain(s.id) + '" class="btn btn-sm btn-ghost" title="Cetak disposisi" aria-label="Cetak disposisi"><i class="fas fa-print"></i></a>' : '') +
                    '</div></td>' +
                '</tr>';
            }).join('');
            
            document.getElementById('table-info').textContent = 'Menampilkan ' + state.data.length + ' dari ' + state.totalItems.toLocaleString('id-ID') + ' surat';
            renderPagination();
        }
        
        function renderPagination() {
            var c = document.getElementById('pagination');
            if (state.totalPages <= 1) { c.innerHTML = ''; return; }
            
            var h = '<button class="btn-page" ' + (state.page === 1 ? 'disabled aria-disabled="true"' : '') + ' data-p="' + (state.page-1) + '" aria-label="Halaman sebelumnya"><i class="fas fa-chevron-left"></i></button>';
            
            for (var i = 1; i <= state.totalPages; i++) {
                if (i === 1 || i === state.totalPages || Math.abs(i - state.page) <= 1) {
                    h += '<button class="btn-page' + (i === state.page ? ' active' : '') + '" data-p="' + i + '" aria-label="Halaman ' + i + '" aria-current="' + (i === state.page ? 'page' : 'false') + '">' + i + '</button>';
                } else if (Math.abs(i - state.page) === 2) {
                    h += '<span style="color:#94a3b8;padding:0 4px;" aria-hidden="true">...</span>';
                }
            }
            
            h += '<button class="btn-page" ' + (state.page === state.totalPages ? 'disabled aria-disabled="true"' : '') + ' data-p="' + (state.page+1) + '" aria-label="Halaman selanjutnya"><i class="fas fa-chevron-right"></i></button>';
            
            c.innerHTML = h;
            c.querySelectorAll('.btn-page[data-p]').forEach(function(b) {
                b.addEventListener('click', function() {
                    state.page = parseInt(this.dataset.p);
                    loadData();
                    document.querySelector('.table-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            });
        }
        
        // ============================================
        // EXPORT FUNCTIONS
        // ============================================
        function exportPDF() {
            if (!window.jspdf || !window.jspdf.jsPDF) {
                showToast('Library PDF sedang dimuat. Coba lagi sebentar.', 'warning');
                return;
            }
            
            try {
                var { jsPDF } = window.jspdf;
                var doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
                
                doc.setFontSize(14);
                doc.text('AGENDA SURAT MASUK', doc.internal.pageSize.getWidth() / 2, 15, { align: 'center' });
                doc.setFontSize(10);
                doc.text('Periode: ' + document.getElementById('periode-label').textContent, 14, 22);
                doc.text('Fakultas Ilmu Komputer', 14, 27);
                
                var head = [['No', 'Tgl Terima', 'Tgl Surat', 'No. Surat', 'Pengirim', 'Perihal', 'Disposisi', 'Ket']];
                var body = state.data.map(function(s, i) {
                    return [
                        (state.page-1)*state.limit + i + 1,
                        formatDate(s.tgl_terima),
                        formatDate(s.tgl_surat),
                        s.nomor_surat || '',
                        s.pengirim || '',
                        s.perihal || '',
                        s.disposisi || '',
                        s.keterangan || ''
                    ];
                });
                
                doc.autoTable({
                    head: head, body: body,
                    startY: 32,
                    styles: { fontSize: 7, cellPadding: 1.5 },
                    headStyles: { fillColor: [30, 41, 59], textColor: [255, 255, 255] },
                    columnStyles: {
                        0: { cellWidth: 8 }, 1: { cellWidth: 20 }, 2: { cellWidth: 20 },
                        3: { cellWidth: 35 }, 4: { cellWidth: 35 }, 5: { cellWidth: 50 },
                        6: { cellWidth: 25 }, 7: { cellWidth: 20 }
                    }
                });
                
                doc.save('agenda-surat-masuk-' + document.getElementById('filter-tahun').value + '-' + 
                    String(document.getElementById('filter-bulan').value).padStart(2,'0') + '.pdf');
                showToast('PDF berhasil diunduh', 'success');
            } catch(e) {
                console.error('PDF export error:', e);
                showToast('Gagal export PDF: ' + e.message, 'error');
            }
        }
        
        function exportExcel() {
            if (!window.XLSX) {
                showToast('Library Excel sedang dimuat. Coba lagi sebentar.', 'warning');
                return;
            }
            
            try {
                var data = [['No', 'Tgl Terima', 'Tgl Surat', 'No. Surat', 'Pengirim', 'Perihal', 'Disposisi', 'Keterangan']];
                state.data.forEach(function(s, i) {
                    data.push([
                        (state.page-1)*state.limit + i + 1,
                        formatDate(s.tgl_terima),
                        formatDate(s.tgl_surat),
                        s.nomor_surat || '',
                        s.pengirim || '',
                        s.perihal || '',
                        s.disposisi || '',
                        s.keterangan || ''
                    ]);
                });
                
                var ws = XLSX.utils.aoa_to_sheet(data);
                ws['!cols'] = [
                    { wch: 5 }, { wch: 14 }, { wch: 14 },
                    { wch: 30 }, { wch: 30 }, { wch: 45 },
                    { wch: 22 }, { wch: 22 }
                ];
                
                var wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Agenda Surat Masuk');
                XLSX.writeFile(wb, 'agenda-surat-masuk-' + 
                    document.getElementById('filter-tahun').value + '-' + 
                    String(document.getElementById('filter-bulan').value).padStart(2,'0') + '.xlsx');
                showToast('Excel berhasil diunduh', 'success');
            } catch(e) {
                console.error('Excel export error:', e);
                showToast('Gagal export Excel: ' + e.message, 'error');
            }
        }
        
        // ============================================
        // LOGOUT
        // ============================================
        function handleLogout() {
            if (!confirm('Apakah Anda yakin ingin keluar?')) return;
            try { if (window.EArsip && window.EArsip.Auth) window.EArsip.Auth.logout(); } catch(e) {}
            localStorage.removeItem('auth_session');
            localStorage.removeItem('auth_token');
            localStorage.removeItem('csrf_token');
            window.location.href = '../../login.html?message=logged_out';
        }
        window.handleLogout = handleLogout;
        
        // ============================================
        // RETRY FUNCTION (exposed for error state)
        // ============================================
        window._retryLoad = function() {
            state.retryCount = 0;
            state.loadError = null;
            loadData();
        };
        
        // ============================================
        // INITIALIZATION
        // ============================================
        function init() {
            console.log('Agenda Surat Masuk v2026.1.0');
            
            // Auth check
            if (!checkAuth()) return;
            
            // Hide loading
            setTimeout(function() {
                document.getElementById('loading-screen').classList.add('hidden');
            }, 300);
            
            // Populate filters
            populateFilters();
            
            // Register Service Worker
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('../../sw.js')
                        .then(function(reg) { console.log('SW registered:', reg.scope); })
                        .catch(function(err) { console.warn('SW failed:', err); });
                });
            }
            
            // Mobile menu
            var menuBtn = document.getElementById('menu-btn');
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('sidebar-overlay');
            
            menuBtn.addEventListener('click', function() {
                sidebar.classList.toggle('mobile-open');
                overlay.classList.toggle('active');
                document.body.style.overflow = sidebar.classList.contains('mobile-open') ? 'hidden' : '';
            });
            
            overlay.addEventListener('click', function() {
                sidebar.classList.remove('mobile-open');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            });
            
            // Close sidebar on swipe right
            var touchStartX = 0;
            document.addEventListener('touchstart', function(e) {
                touchStartX = e.touches[0].clientX;
            }, { passive: true });
            
            document.addEventListener('touchend', function(e) {
                var diff = e.changedTouches[0].clientX - touchStartX;
                if (diff > 100 && sidebar.classList.contains('mobile-open')) {
                    sidebar.classList.remove('mobile-open');
                    overlay.classList.remove('active');
                    document.body.style.overflow = '';
                }
            });
            
            // Filter events
            document.getElementById('filter-bulan').addEventListener('change', function() { state.page = 1; loadData(); });
            document.getElementById('filter-tahun').addEventListener('change', function() { state.page = 1; loadData(); });
            document.getElementById('filter-sumber').addEventListener('change', function() { state.page = 1; loadData(); });
            document.getElementById('search-input').addEventListener('input', debounce(function() { state.page = 1; loadData(); }, 400));
            
            document.getElementById('reset-filter').addEventListener('click', function() {
                document.getElementById('search-input').value = '';
                document.getElementById('filter-sumber').value = '';
                populateFilters();
                state.page = 1;
                loadData();
            });
            
            document.getElementById('refresh-btn').addEventListener('click', function() {
                state.retryCount = 0;
                loadData();
                showToast('Data diperbarui', 'info');
            });
            
            // Export events (with availability check)
            document.getElementById('export-pdf-btn').addEventListener('click', function() {
                if (!window.jspdf) {
                    showToast('Library PDF sedang dimuat, coba lagi...', 'info');
                    return;
                }
                exportPDF();
            });
            
            document.getElementById('export-excel-btn').addEventListener('click', function() {
                if (!window.XLSX) {
                    showToast('Library Excel sedang dimuat, coba lagi...', 'info');
                    return;
                }
                exportExcel();
            });
            
            // Keyboard shortcuts
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'r') {
                    e.preventDefault();
                    state.retryCount = 0;
                    loadData();
                }
                if (e.key === 'Escape' && sidebar.classList.contains('mobile-open')) {
                    sidebar.classList.remove('mobile-open');
                    overlay.classList.remove('active');
                    document.body.style.overflow = '';
                }
            });
            
            // Initial load
            loadData();
            
            console.log('Agenda Surat Masuk initialized');
        }
        
        // Start when DOM ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
        
    })();
    </script>
</body>
</html>
