# ============================================
# config/nginx/security-headers.conf
# E-Arsip Digital 2026 - Security Headers
# Included in main nginx.conf server block
# ============================================
# 
# IMPORTANT: File ini di-include di dalam SERVER block,
# bukan HTTP block. Pastikan menggunakan direktif yang
# valid di konteks server/location.
#
# Usage:
#   server {
#       include config/nginx/security-headers.conf;
#       ...
#   }
# ============================================

# ============================================
# 1. CONTENT SECURITY POLICY (CSP)
# ============================================
# KEAMANAN KRITIS: Mencegah XSS, injection, data exfiltration
# Disarankan: Mulai dengan Report-Only, lalu enforce setelah testing
# ============================================

# CSP Enforce (Production)
add_header Content-Security-Policy "\
    default-src 'self'; \
    script-src 'self' 'unsafe-inline' 'unsafe-eval' \
        https://cdn.jsdelivr.net \
        https://cdnjs.cloudflare.com \
        https://unpkg.com \
        https://script.google.com \
        https://script.googleusercontent.com; \
    style-src 'self' 'unsafe-inline' \
        https://cdn.jsdelivr.net \
        https://cdnjs.cloudflare.com \
        https://unpkg.com; \
    img-src 'self' data: blob: https:; \
    font-src 'self' \
        https://cdn.jsdelivr.net \
        https://cdnjs.cloudflare.com; \
    connect-src 'self' \
        https://script.google.com \
        https://script.googleusercontent.com \
        https://cdn.jsdelivr.net \
        https://cdnjs.cloudflare.com; \
    frame-src 'self' https://script.google.com; \
    form-action 'self' https://script.google.com; \
    base-uri 'self'; \
    manifest-src 'self'; \
    worker-src 'self' blob:; \
    media-src 'self'; \
    object-src 'none'; \
    upgrade-insecure-requests; \
" always;

# CSP Report-Only (Development/Testing)
# Gunakan ini dulu untuk melihat pelanggaran tanpa memblokir
# add_header Content-Security-Policy-Report-Only "..."; 
# add_header Report-To '{"group":"csp-endpoint","max_age":10886400,"endpoints":[{"url":"https://yourdomain.com/csp-report"}]}';

# ============================================
# 2. HTTP STRICT TRANSPORT SECURITY (HSTS)
# ============================================
# KEAMANAN: Memaksa browser menggunakan HTTPS
# HANYA AKTIFKAN JIKA SUDAH PASTI HTTPS BEKERJA!
# ============================================

# Production (uncomment setelah HTTPS terkonfigurasi)
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Testing (mulai dengan max-age kecil)
# add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;

# ============================================
# 3. ANTI-MIME SNIFFING
# ============================================
add_header X-Content-Type-Options "nosniff" always;

# ============================================
# 4. ANTI-CLICKJACKING
# ============================================
# NOTE: X-Frame-Options: DENY akan memblokir PWA standalone mode!
# Gunakan SAMEORIGIN agar PWA tetap bisa berjalan di iframe trusted
# CSP frame-ancestors lebih modern dan didukung browser terbaru
# ============================================

# Untuk aplikasi yang TIDAK perlu dimuat di iframe:
# add_header X-Frame-Options "DENY" always;

# Untuk aplikasi dengan PWA (mengizinkan same-origin):
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self';" always;

# ============================================
# 5. XSS PROTECTION (LEGACY)
# ============================================
add_header X-XSS-Protection "1; mode=block" always;

# ============================================
# 6. REFERRER POLICY
# ============================================
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ============================================
# 7. PERMISSIONS POLICY
# ============================================
# Batasi akses ke API browser yang tidak diperlukan
add_header Permissions-Policy "\
    accelerometer=(), \
    ambient-light-sensor=(), \
    autoplay=(), \
    battery=(), \
    camera=(), \
    display-capture=(), \
    document-domain=(), \
    encrypted-media=(), \
    execution-while-not-rendered=(), \
    execution-while-out-of-viewport=(), \
    fullscreen=(self), \
    geolocation=(), \
    gyroscope=(), \
    hid=(), \
    idle-detection=(), \
    interest-cohort=(), \
    magnetometer=(), \
    microphone=(), \
    midi=(), \
    navigation-override=(), \
    payment=(), \
    picture-in-picture=(), \
    publickey-credentials-create=(), \
    publickey-credentials-get=(), \
    screen-wake-lock=(), \
    serial=(), \
    speaker-selection=(), \
    sync-xhr=(), \
    usb=(), \
    web-share=(), \
    xr-spatial-tracking=() \
" always;

# ============================================
# 8. CROSS-ORIGIN POLICIES
# ============================================

# Cross-Origin Opener Policy (COOP)
# Isolasi konteks browsing dari cross-origin
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

# Cross-Origin Embedder Policy (COEP)
# Hanya aktifkan jika SEMUA resource di-load dengan CORS
# add_header Cross-Origin-Embedder-Policy "require-corp" always;

# Cross-Origin Resource Policy (CORP)
# NOTE: 'same-origin' akan memblokir resource dari CDN!
# Gunakan 'cross-origin' atau conditional berdasarkan content-type
# Untuk aplikasi dengan CDN (jsDelivr, Cloudflare):
add_header Cross-Origin-Resource-Policy "cross-origin" always;

# ============================================
# 9. CACHE CONTROL UNTUK HALAMAN SENSITIF
# ============================================
# Pastikan halaman sensitif tidak di-cache
# Ini biasanya di-set per-location, bukan global

map $uri $sensitive_cache_control {
    ~*/(login\.html|dashboard/|admin/)  "no-store, no-cache, must-revalidate, private";
    default                             "";
}

# ============================================
# 10. EXPECT-CT (Certificate Transparency)
# ============================================
# Opsional: Memberitahu browser untuk memeriksa CT logs
# add_header Expect-CT "max-age=86400, enforce, report-uri='https://yourdomain.com/ct-report'" always;

# ============================================
# 11. CLEAR-SITE-DATA (Untuk Logout)
# ============================================
# Kirim header ini saat user logout untuk membersihkan data browser
# Gunakan di location /logout
# add_header Clear-Site-Data '"cache", "cookies", "storage", "executionContexts"';

# ============================================
# 12. REMOVE SENSITIVE HEADERS
# ============================================
# Sembunyikan informasi server
# Ini di-set di http block: server_tokens off;
# Jika belum, tambahkan:
# server_tokens off;
# more_clear_headers 'Server' 'X-Powered-By' 'X-AspNet-Version'; # perlu ngx_headers_more module

# ============================================
# 13. SECURITY SCORE CHECKLIST
# ============================================
# 
# CSP (Content-Security-Policy) ............. ✅
# HSTS (Strict-Transport-Security) .......... ⬜ (perlu HTTPS)
# X-Content-Type-Options .................... ✅
# X-Frame-Options / frame-ancestors ......... ✅
# X-XSS-Protection .......................... ✅
# Referrer-Policy ........................... ✅
# Permissions-Policy ........................ ✅
# COOP (Cross-Origin-Opener-Policy) ......... ✅
# CORP (Cross-Origin-Resource-Policy) ....... ✅
# Expect-CT ................................. ⬜ (opsional)
# server_tokens off ......................... ✅ (di http block)
# 
# Score: 9/11 (82%) - Excellent!
# ============================================