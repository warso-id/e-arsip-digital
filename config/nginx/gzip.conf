# config/nginx/gzip.conf
# Included in main nginx.conf for compression settings

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types
    text/plain text/css text/xml text/javascript text/csv
    application/javascript application/json application/xml
    application/rss+xml application/atom+xml application/x-javascript
    application/manifest+json image/svg+xml image/x-icon
    font/ttf font/otf font/woff font/woff2;
