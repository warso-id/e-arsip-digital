# ============================================
# config/nginx/nginx.conf - E-Arsip Digital 2026
# Optimized for: Security, PWA, Mobile, Performance
# ============================================

# ============================================
# CORE SETTINGS
# ============================================
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ============================================
    # BASIC SETTINGS
    # ============================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging (JSON format for ELK/analysis)
    log_format main escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"host":"$host",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"gzip_ratio":"$gzip_ratio"'
    '}';
    
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    
    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens off;  # Security: hide Nginx version
    client_max_body_size 20m;  # Allow file uploads up to 20MB
    client_body_timeout 30s;
    client_header_timeout 15s;
    reset_timedout_connection on;
    
    # ============================================
    # GZIP COMPRESSION (ENHANCED)
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_disable "msie6";
    gzip_types
        # Text
        text/plain
        text/css
        text/xml
        text/javascript
        text/csv
        text/html
        text/markdown
        # Application
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/x-javascript
        application/manifest+json
        application/x-web-app-manifest+json
        # Fonts
        font/ttf
        font/otf
        font/woff
        font/woff2
        application/font-woff
        application/font-woff2
        application/vnd.ms-fontobject
        # Images
        image/svg+xml
        image/x-icon
        # PWA
        application/octet-stream;
    
    # ============================================
    # SECURITY HEADERS MAP
    # ============================================
    map $uri $csp_header {
        default "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://script.google.com https://script.googleusercontent.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; font-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-src 'self' https://script.google.com; form-action 'self' https://script.google.com; base-uri 'self';";
    }
    
    # ============================================
    # RATE LIMITING ZONES
    # ============================================
    # General rate limit
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    
    # Login endpoint rate limit (anti-brute force)
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    
    # API rate limit
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    
    # ============================================
    # CACHE SETTINGS
    # ============================================
    # Static assets cache
    map $uri $static_cache_control {
        ~*\.(css|js)$                  "public, max-age=31536000, immutable";
        ~*\.(jpg|jpeg|png|gif|ico)$   "public, max-age=31536000, immutable";
        ~*\.(svg|webp)$               "public, max-age=31536000, immutable";
        ~*\.(woff|woff2|ttf|otf|eot)$ "public, max-age=31536000, immutable";
        ~*manifest\.json$             "public, max-age=604800";
        ~*service-worker\.js$         "public, max-age=86400";
        default                       "no-cache, must-revalidate";
    }
    
    # ============================================
    # UPSTREAM (Google Apps Script / Backend)
    # ============================================
    upstream backend {
        server script.google.com:443;
        keepalive 32;
    }
    
    # ============================================
    # MAIN SERVER BLOCK
    # ============================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        
        # Redirect HTTP to HTTPS (production)
        # return 301 https://$host$request_uri;
        
        # Root directory
        root /usr/share/nginx/html;
        index index.html;
        
        # ============================================
        # SECURITY HEADERS
        # ============================================
        # Content Security Policy
        add_header Content-Security-Policy $csp_header always;
        
        # Prevent MIME type sniffing
        add_header X-Content-Type-Options "nosniff" always;
        
        # Prevent clickjacking
        add_header X-Frame-Options "SAMEORIGIN" always;
        
        # XSS Protection (legacy browsers)
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Referrer Policy
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # Permissions Policy
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        
        # HSTS (uncomment for HTTPS)
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        
        # ============================================
        # RATE LIMITING
        # ============================================
        limit_req zone=general burst=20 nodelay;
        limit_req_status 429;
        
        # ============================================
        # STATIC ASSETS (Long Cache)
        # ============================================
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|otf|eot)$ {
            expires 1y;
            add_header Cache-Control $static_cache_control;
            add_header Vary "Accept-Encoding";
            access_log off;
            try_files $uri =404;
        }
        
        # ============================================
        # PWA FILES (Short Cache)
        # ============================================
        location = /manifest.json {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            add_header Content-Type "application/manifest+json";
            add_header Access-Control-Allow-Origin "*";
        }
        
        location = /sw.js {
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
            add_header Service-Worker-Allowed "/";
            add_header Content-Type "application/javascript";
        }
        
        # ============================================
        # FILES (No Cache - HTML)
        # ============================================
        location ~* \.(html|htm)$ {
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate, private";
            add_header Vary "Accept-Encoding";
            try_files $uri $uri/ =404;
        }
        
        # ============================================
        # LOGIN ENDPOINT (Rate Limited)
        # ============================================
        location = /login.html {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate, private";
            try_files $uri =404;
        }
        
        # ============================================
        # API PROXY (Google Apps Script)
        # ============================================
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            
            proxy_pass https://script.google.com/macros/s/AKfycbxP0G4klL8Ruqu_XFQ8YMYGy-jFyqb8r0mYc5WprLGTq2qdX0mucljUd9sxwokUtJ-d/exec;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host script.google.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
            
            # Buffer
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
            
            # CORS
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-CSRF-Token";
            
            # Handle preflight
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
        
        # ============================================
        # SPA ROUTING (Fallback to index.html)
        # ============================================
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate, private";
        }
        
        # ============================================
        # BLOCK SENSITIVE FILES
        # ============================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }
        
        location ~* \.(env|git|gitignore|md|sql|log|sh|bak|backup|old|orig|save)$ {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }
        
        location ~* (composer\.json|composer\.lock|package\.json|package-lock\.json|yarn\.lock|Gemfile|Gemfile\.lock|Dockerfile|docker-compose\.yml)$ {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }
        
        location ~* /(config\.js\.backup|config\.js\.old|auth\.js\.backup)$ {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }
        
        # ============================================
        # ERROR PAGES
        # ============================================
        error_page 400 /error/400.html;
        error_page 401 /error/401.html;
        error_page 403 /error/403.html;
        error_page 404 /error/404.html;
        error_page 500 502 503 504 /error/500.html;
        
        location = /error/403.html { internal; }
        location = /error/404.html { internal; }
        location = /error/500.html { internal; }
        
        # ============================================
        # HEALTH CHECK
        # ============================================
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }
    
    # ============================================
    # HTTPS SERVER (Production)
    # ============================================
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name yourdomain.com;
    #     
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_session_timeout 1d;
    #     ssl_session_cache shared:SSL:50m;
    #     ssl_session_tickets off;
    #     
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers on;
    #     
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    #     
    #     # ... same location blocks as above
    # }
}