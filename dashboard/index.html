<!-- dashboard/index.html - Dashboard Router 2026 (SECURE PWA) -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="E-Arsip">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="Dashboard Router - E-Arsip Digital">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../icons/icon-192.png">
    
    <!-- CSP -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        font-src 'self';
        connect-src 'self';
        base-uri 'self';
    ">
    
    <!-- Anti-Clickjacking -->
    <style>html{display:none;}</style>
    <script>if(self===top)document.documentElement.style.display='block';else top.location=self.location;</script>
    
    <title>Dashboard - E-Arsip Digital</title>
    
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
            --text: #ffffff;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 50%, #764ba2 100%);
            min-height: 100vh; min-height: -webkit-fill-available;
            display: flex; align-items: center; justify-content: center;
            color: var(--text); text-align: center; padding: 20px;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
            -webkit-font-smoothing: antialiased;
        }
        
        .router-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 44px 36px;
            max-width: 440px;
            width: 100%;
            animation: fadeInUp 0.6s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .router-icon {
            font-size: 56px;
            margin-bottom: 16px;
            display: block;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        .router-card h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }
        
        .router-card .version {
            font-size: 11px;
            opacity: 0.6;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .spinner-container {
            margin-bottom: 16px;
        }
        
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .status-text {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
            min-height: 20px;
        }
        
        .status-detail {
            font-size: 12px;
            opacity: 0.65;
            margin-bottom: 20px;
            min-height: 16px;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 11px 24px;
            background: white;
            color: var(--primary);
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.25s;
            border: none;
            cursor: pointer;
            font-family: inherit;
            min-height: 44px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }
        
        .btn:active {
            transform: scale(0.97);
        }
        
        .btn-outline {
            background: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }
        
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.7);
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .debug-panel {
            margin-top: 20px;
            padding: 14px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            font-size: 11px;
            text-align: left;
            opacity: 0.7;
            max-height: 120px;
            overflow-y: auto;
            font-family: 'SF Mono', 'Consolas', monospace;
            display: none;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .debug-panel.show {
            display: block;
        }
        
        .debug-panel .log-line {
            padding: 1px 0;
        }
        
        .debug-panel .log-line.success { color: #4ade80; }
        .debug-panel .log-line.warning { color: #fbbf24; }
        .debug-panel .log-line.error { color: #f87171; }
        .debug-panel .log-line.info { color: #93c5fd; }
        
        .error-icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: none;
        }
        
        .error-icon.show {
            display: block;
        }
        
        @media (max-width: 480px) {
            .router-card {
                padding: 32px 20px;
                border-radius: 20px;
            }
            
            .router-card h1 {
                font-size: 20px;
            }
            
            .btn-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="router-card">
        <span class="router-icon">📁</span>
        <h1>E-Arsip Digital</h1>
        <p class="version">v2026.1.0</p>
        
        <div class="spinner-container" id="spinner-container">
            <div class="spinner"></div>
        </div>
        
        <span class="error-icon" id="error-icon">⚠️</span>
        
        <p class="status-text" id="status-text">Memeriksa sesi...</p>
        <p class="status-detail" id="status-detail"></p>
        
        <div class="btn-group" id="btn-group" style="display:none;">
            <a href="../login.html" class="btn" id="btn-login">
                <i class="fas fa-sign-in-alt"></i> Kembali ke Login
            </a>
            <a href="../index.html" class="btn btn-outline" id="btn-home">
                <i class="fas fa-home"></i> Beranda
            </a>
        </div>
        
        <div class="debug-panel" id="debug-panel"></div>
    </div>
    
    <script>
    // ============================================
    // DASHBOARD ROUTER v2026.1.0 (SECURE)
    // ============================================
    (function() {
        'use strict';
        
        // ============================================
        // ROLE ROUTES (LENGKAP - 16 roles)
        // ============================================
        var routes = {
            'super_admin': 'super-admin/index.html',
            'admin': 'admin/index.html',
            'kasubag': 'kasubag/index.html',
            'kaprodi': 'kaprodi/index.html',
            'admin_kaprodi': 'admin-kaprodi/index.html',
            'wadek': 'wadek/index.html',
            'admin_wadek': 'admin-wadek/index.html',
            'dekan': 'dekan/index.html',
            'admin_dekan': 'admin-dekan/index.html',
            'ketua_upm': 'ketua-upm/index.html',
            'litdianmas': 'litdianmas/index.html',
            'staf': 'staf/index.html',
            'dosen': 'dosen/index.html',
            'lembaga_kemahasiswaan': 'lembaga-kemahasiswaan/index.html',
            'mahasiswa': 'mahasiswa/index.html',
            'user': 'user/index.html'
        };
        
        // Role display names
        var roleNames = {
            'super_admin': 'Super Admin',
            'admin': 'Admin',
            'kasubag': 'Kasubag',
            'kaprodi': 'Kaprodi',
            'admin_kaprodi': 'Admin Kaprodi',
            'wadek': 'Wakil Dekan',
            'admin_wadek': 'Admin Wadek',
            'dekan': 'Dekan',
            'admin_dekan': 'Admin Dekan',
            'ketua_upm': 'Ketua UPM',
            'litdianmas': 'Litdianmas',
            'staf': 'Staf',
            'dosen': 'Dosen',
            'lembaga_kemahasiswaan': 'Lembaga Kemahasiswaan',
            'mahasiswa': 'Mahasiswa',
            'user': 'User'
        };
        
        // ============================================
        // STATE
        // ============================================
        var state = {
            debugMode: false,
            redirectDelay: 800,
            maxWaitTime: 5000
        };
        
        // ============================================
        // UI HELPERS
        // ============================================
        function setStatus(text, detail) {
            document.getElementById('status-text').textContent = text;
            document.getElementById('status-detail').textContent = detail || '';
        }
        
        function showSpinner(show) {
            document.getElementById('spinner-container').style.display = show ? 'block' : 'none';
        }
        
        function showError(show) {
            document.getElementById('error-icon').classList.toggle('show', show);
        }
        
        function showButtons(show) {
            document.getElementById('btn-group').style.display = show ? 'flex' : 'none';
        }
        
        // ============================================
        // DEBUG LOGGING
        // ============================================
        function log(message, type) {
            type = type || 'info';
            console.log('[Router] ' + message);
            
            if (state.debugMode || type === 'error') {
                var panel = document.getElementById('debug-panel');
                panel.classList.add('show');
                panel.innerHTML += '<div class="log-line ' + type + '">[' + 
                    new Date().toLocaleTimeString() + '] ' + 
                    sanitizeHTML(message) + '</div>';
                panel.scrollTop = panel.scrollHeight;
            }
        }
        
        function sanitizeHTML(str) {
            if (!str) return '';
            var div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        
        // Enable debug with ?debug=1
        if (window.location.search.indexOf('debug=1') !== -1) {
            state.debugMode = true;
        }
        
        // ============================================
        // REDIRECT FUNCTION
        // ============================================
        function redirectTo(url) {
            log('Redirecting to: ' + url, 'success');
            setStatus('Mengalihkan ke dashboard...', url);
            showSpinner(true);
            showError(false);
            
            setTimeout(function() {
                window.location.href = url;
            }, state.redirectDelay);
        }
        
        function showLoginFallback() {
            log('No valid session found', 'warning');
            setStatus('Sesi tidak ditemukan', 'Silakan login kembali');
            showSpinner(false);
            showError(true);
            showButtons(true);
            
            // Auto-redirect after delay
            setTimeout(function() {
                log('Auto-redirecting to login...', 'info');
                window.location.href = '../login.html';
            }, state.maxWaitTime);
        }
        
        // ============================================
        // SESSION CHECK
        // ============================================
        function checkSession() {
            log('Starting session check...', 'info');
            
            // Method 1: Check EArsip Auth module
            if (window.EArsip && window.EArsip.Auth && window.EArsip.Auth.isAuthenticated) {
                var user = window.EArsip.Auth.currentUser;
                if (user && user.role) {
                    log('Session found via EArsip Auth: ' + user.username + ' (' + user.role + ')', 'success');
                    if (routes[user.role]) {
                        redirectTo(routes[user.role]);
                        return true;
                    }
                }
            }
            
            // Method 2: Check localStorage
            try {
                var sessionStr = localStorage.getItem('auth_session');
                if (sessionStr) {
                    var session = JSON.parse(sessionStr);
                    
                    // Validate session structure
                    if (!session.user || !session.user.role) {
                        log('Session invalid: missing user/role', 'error');
                        localStorage.removeItem('auth_session');
                        return false;
                    }
                    
                    // Validate expiry
                    if (session.expiresAt && Date.now() >= session.expiresAt) {
                        log('Session expired at: ' + new Date(session.expiresAt).toLocaleString(), 'warning');
                        localStorage.removeItem('auth_session');
                        localStorage.removeItem('auth_token');
                        return false;
                    }
                    
                    // Validate role route exists
                    if (!routes[session.user.role]) {
                        log('Unknown role: ' + session.user.role + ', falling back to user', 'warning');
                        redirectTo(routes['user']);
                        return true;
                    }
                    
                    log('Session valid: ' + (session.user.username || session.user.id) + 
                        ' (' + session.user.role + ')', 'success');
                    log('Expires: ' + new Date(session.expiresAt).toLocaleString(), 'info');
                    
                    redirectTo(routes[session.user.role]);
                    return true;
                }
            } catch (e) {
                log('Error parsing session: ' + e.message, 'error');
                localStorage.removeItem('auth_session');
            }
            
            // Method 3: Check sessionStorage (remember me unchecked)
            try {
                var sessionStr2 = sessionStorage.getItem('auth_session');
                if (sessionStr2) {
                    var session2 = JSON.parse(sessionStr2);
                    if (session2.user && session2.user.role && routes[session2.user.role]) {
                        if (!session2.expiresAt || Date.now() < session2.expiresAt) {
                            log('Session found in sessionStorage', 'success');
                            redirectTo(routes[session2.user.role]);
                            return true;
                        }
                    }
                }
            } catch (e) {}
            
            return false;
        }
        
        // ============================================
        // INITIALIZATION
        // ============================================
        function init() {
            log('Dashboard Router v2026.1.0 initialized', 'info');
            log('URL: ' + window.location.href, 'info');
            log('Debug mode: ' + (state.debugMode ? 'ON' : 'OFF'), 'info');
            
            // Register Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('../sw.js')
                    .then(function() { log('SW registered', 'success'); })
                    .catch(function(err) { log('SW failed: ' + err.message, 'warning'); });
            }
            
            // Check session
            var hasSession = checkSession();
            
            if (!hasSession) {
                showLoginFallback();
            }
        }
        
        // Start when DOM ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
        
    })();
    </script>
</body>
</html>
