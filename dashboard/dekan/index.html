<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dekan">

        default-src 'self';

    <title>Dashboard Dekan - E-Arsip Digital</title>
    
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #1b5e20; --primary-dark: #2e7d32; --accent: #4caf50;
            --success: #16a34a; --danger: #dc2626; --warning: #d97706; --info: #0891b2;
            --gold: #ffd700;
            --text: #1e293b; --text-light: #64748b;
            --bg: #f5f6fa; --white: #ffffff; --border: #e2e8f0;
            --radius: 12px; --radius-sm: 8px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; padding-bottom:var(--safe-bottom); }
        
        .network-bar { position:fixed; top:0; left:0; right:0; z-index:9999; padding:8px; text-align:center; font-size:12px; font-weight:600; transform:translateY(-100%); transition:transform 0.3s; }
        .network-bar.offline { transform:translateY(0); background:#fef2f2; color:#dc2626; }
        .network-bar.restored { transform:translateY(0); background:#f0fdf4; color:#16a34a; animation:slideDown 0.3s, slideUp 0.3s 2.5s forwards; }
        @keyframes slideDown { from{transform:translateY(-100%)} to{transform:translateY(0)} }
        @keyframes slideUp { from{transform:translateY(0)} to{transform:translateY(-100%)} }
        
        .loading-screen { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--white); display:flex; align-items:center; justify-content:center; z-index:9998; transition:opacity 0.4s; }
        .loading-screen.hidden { opacity:0; visibility:hidden; pointer-events:none; }
        .spinner { width:44px; height:44px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin 0.8s linear infinite; }
        @keyframes spin { to{transform:rotate(360deg)} }
        
        .sidebar { position:fixed; top:0; left:0; width:260px; height:100vh; background:linear-gradient(180deg,var(--primary),var(--primary-dark)); color:white; z-index:100; overflow-y:auto; transition:transform 0.3s; padding-top:var(--safe-top); }
        .sidebar-brand { padding:22px 20px; text-align:center; border-bottom:1px solid rgba(255,255,255,0.1); }
        .sidebar-brand .logo { font-size:36px; color:var(--gold); margin-bottom:6px; display:block; }
        .sidebar-brand h5 { font-size:15px; font-weight:700; margin:0; }
        .sidebar-brand small { font-size:11px; opacity:0.7; }
        .sidebar-nav { padding:12px 0; }
        .sidebar-nav .nav-item { display:flex; align-items:center; gap:10px; padding:12px 22px; color:rgba(255,255,255,0.75); text-decoration:none; font-size:13px; font-weight:500; transition:all 0.25s; border-left:3px solid transparent; }
        .sidebar-nav .nav-item:hover { background:rgba(255,255,255,0.08); color:white; }
        .sidebar-nav .nav-item.active { background:rgba(255,255,255,0.12); color:white; border-left-color:var(--gold); font-weight:600; }
        .sidebar-nav .nav-item i { width:20px; text-align:center; font-size:14px; }
        .sidebar-nav .nav-item.logout { color:rgba(255,100,100,0.8); margin-top:16px; border-top:1px solid rgba(255,255,255,0.08); padding-top:16px; }
        .sidebar-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:99; }
        
        .main-content { margin-left:260px; min-height:100vh; padding:24px; padding-top:calc(24px + var(--safe-top)); transition:margin 0.3s; }
        .top-bar { background:var(--white); padding:14px 22px; box-shadow:var(--shadow-sm); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:50; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:10px; }
        .top-bar .page-title { font-size:17px; font-weight:700; margin:0; }
        .user-menu { display:flex; align-items:center; gap:12px; }
        .avatar { width:38px; height:38px; background:linear-gradient(135deg,var(--primary),var(--accent)); color:white; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; }
        .time-display { font-size:12px; color:var(--text-light); }
        
        .mobile-header { display:none; position:sticky; top:0; z-index:50; background:rgba(255,255,255,0.95); backdrop-filter:blur(10px); padding:10px 16px; border-bottom:1px solid var(--border); align-items:center; gap:10px; }
        .mobile-header .hamburger { width:36px; height:36px; border:none; background:#f1f5f9; border-radius:8px; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        
        .btn { display:inline-flex; align-items:center; gap:6px; padding:10px 18px; font-size:14px; font-weight:600; border:none; border-radius:var(--radius-sm); cursor:pointer; text-decoration:none; transition:all 0.25s; font-family:inherit; min-height:44px; }
        .btn:active { transform:scale(0.97); }
        .btn-primary { background:var(--primary); color:white; }
        .btn-primary:hover { background:var(--primary-dark); }
        .btn-outline { background:transparent; color:var(--primary); border:2px solid var(--primary); }
        .btn-success { background:var(--success); color:white; }
        .btn-info { background:var(--info); color:white; }
        .btn-sm { padding:6px 14px; font-size:12px; min-height:34px; }
        
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:20px; }
        .stat-card { background:var(--white); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow-sm); border:1px solid var(--border); transition:all 0.25s; cursor:pointer; }
        .stat-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-md); }
        .stat-card .stat-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
        .stat-icon { width:50px; height:50px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; color:white; }
        .stat-value { font-size:28px; font-weight:800; line-height:1; }
        .stat-label { font-size:12px; color:var(--text-light); margin-top:2px; }
        
        .card { background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow-sm); border:1px solid var(--border); margin-bottom:18px; overflow:hidden; }
        .card-header { padding:14px 18px; border-bottom:1px solid var(--border); }
        .card-header h5 { font-size:15px; font-weight:600; margin:0; }
        .card-body { padding:18px; }
        
        .quick-actions { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; }
        
        .table-scroll { overflow-x:auto; }
        .data-table { width:100%; border-collapse:collapse; font-size:13px; }
        .data-table th { background:#f8fafc; padding:10px 12px; text-align:left; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-light); border-bottom:2px solid var(--border); }
        .data-table td { padding:10px 12px; border-bottom:1px solid #f1f5f9; }
        
        .badge { font-size:10px; padding:3px 10px; border-radius:20px; font-weight:600; }
        .badge-warning { background:#fef3c7; color:#d97706; }
        .badge-success { background:#dcfce7; color:#16a34a; }
        .badge-danger { background:#fef2f2; color:#dc2626; }
        
        .signature-card { background:var(--white); border-radius:var(--radius); padding:16px; margin-bottom:10px; border:1px solid var(--border); border-left:4px solid var(--accent); transition:all 0.25s; }
        .signature-card:hover { box-shadow:var(--shadow-md); }
        .signature-card.urgent { border-left-color:var(--danger); }
        
        /* Modal */
        .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9998; align-items:center; justify-content:center; }
        .modal-overlay.active { display:flex; }
        .modal-dialog { background:white; border-radius:var(--radius); padding:24px; max-width:500px; width:90%; box-shadow:0 20px 60px rgba(0,0,0,0.2); animation:modalIn 0.3s; }
        @keyframes modalIn { from{opacity:0;transform:scale(0.95)} to{opacity:1;transform:scale(1)} }
        .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
        .modal-close { width:32px; height:32px; border:none; background:#f1f5f9; border-radius:6px; cursor:pointer; font-size:16px; }
        
        .toast-container { position:fixed; top:calc(12px + var(--safe-top)); right:12px; z-index:9999; display:flex; flex-direction:column; gap:6px; }
        .toast { padding:10px 16px; border-radius:10px; color:white; font-size:13px; font-weight:500; box-shadow:0 10px 25px rgba(0,0,0,0.15); animation:slideInRight 0.3s; }
        .toast-success { background:var(--success); }
        .toast-error { background:var(--danger); }
        .toast-info { background:var(--info); }
        @keyframes slideInRight { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }
        
        @media (max-width:768px) {
            .sidebar { transform:translateX(-100%); width:280px; }
            .sidebar.mobile-open { transform:translateX(0); }
            .sidebar-overlay.active { display:block; }
            .main-content { margin-left:0; padding:14px; }
            .mobile-header { display:flex; }
            .top-bar { display:none; }
            .stats-grid { grid-template-columns:repeat(2,1fr); }
        }
    </style>
</head>
<body>
    <div class="network-bar" id="network-bar"><span id="network-msg"></span></div>
    <div class="loading-screen" id="loading-screen"><div class="spinner"></div></div>
    <div class="toast-container" id="toast-container"></div>
    
    <!-- TTD Modal -->
    <div class="modal-overlay" id="ttd-modal">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3><i class="fas fa-signature" style="color:var(--primary);margin-right:8px;"></i>Tanda Tangan & Final Approval</h3>
                <button class="modal-close" id="ttd-modal-close">&times;</button>
            </div>
            <div style="margin-bottom:14px;padding:12px;background:#f0fdf4;border-radius:8px;font-size:13px;color:var(--success);">
                <i class="fas fa-info-circle"></i> Approval final - surat akan di-generate dalam format PDF
            </div>
            <div style="margin-bottom:12px;">
                <label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px;">Status Final <span style="color:var(--danger);">*</span></label>
                <select id="ttd-status" style="width:100%;padding:10px;border:2px solid var(--border);border-radius:8px;font-size:14px;">
                    <option value="">-- Pilih Status --</option>
                    <option value="disetujui">Setujui & Tanda Tangani</option>
                    <option value="revisi">Perlu Revisi</option>
                    <option value="ditolak">Tolak</option>
                </select>
            </div>
            <div style="margin-bottom:12px;">
                <label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px;">Catatan</label>
                <textarea id="ttd-catatan" rows="3" style="width:100%;padding:10px;border:2px solid var(--border);border-radius:8px;font-size:14px;resize:vertical;" placeholder="Tambahkan catatan..." maxlength="500"></textarea>
            </div>
            <div style="margin-bottom:14px;">
                <label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px;">Upload Tanda Tangan</label>
                <input type="file" id="ttd-file" accept="image/jpeg,image/png" style="width:100%;">
                <small style="color:var(--text-light);">Format JPG/PNG (opsional)</small>
                <div id="ttd-preview" style="display:none;margin-top:8px;">
                    <img id="ttd-image" style="max-height:80px;border:1px solid var(--border);padding:4px;border-radius:4px;">
                </div>
            </div>
            <input type="hidden" id="ttd-nomor-surat">
            <div style="display:flex;gap:8px;justify-content:flex-end;">
                <button class="btn btn-outline btn-sm" id="ttd-cancel">Batal</button>
                <button class="btn btn-success btn-sm" id="ttd-submit"><i class="fas fa-signature"></i> Tanda Tangani</button>
            </div>
        </div>
    </div>
    
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <span class="logo">📁</span>
            <h5>E-Arsip Digital</h5>
            <small>Dekan Panel</small>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-page="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="#" class="nav-item" data-page="final-approval"><i class="fas fa-check-double"></i> Final Approval & TTD</a>
            <a href="#" class="nav-item" data-page="disposisi-masuk"><i class="fas fa-clipboard-list"></i> Disposisi Masuk</a>
            <a href="#" class="nav-item" data-page="semua-surat"><i class="fas fa-list"></i> Semua Surat</a>
            <a href="#" class="nav-item" data-page="laporan"><i class="fas fa-chart-bar"></i> Laporan</a>
            <a href="#" class="nav-item" data-page="profile"><i class="fas fa-user-circle"></i> Profil</a>
            <a href="#" class="nav-item logout" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>

    <div class="mobile-header">
        <button class="hamburger" id="menu-btn"><i class="fas fa-bars"></i></button>
        <span style="font-weight:700;flex:1;">Dekan Dashboard</span>
        <span class="time-display" id="mobile-time"></span>
    </div>
    
    <main class="main-content">
        <div class="top-bar">
            <h5 class="page-title" id="pageTitle">Dashboard Dekan</h5>
            <div class="user-menu">
                <span class="time-display" id="currentTime"></span>
                <div class="avatar" id="userAvatar">D</div>
                <span style="font-size:14px;font-weight:500;" id="displayName">Dekan</span>
            </div>
        </div>
        <div id="contentArea" style="padding-top:16px;"></div>
    </main>
    
    <script src="../../config/config.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    
    <script>
    (function(){
        'use strict';
        var csrfToken=(function(){var t=localStorage.getItem('csrf_token');if(!t){var a=new Uint32Array(8);crypto.getRandomValues(a);t=Array.from(a,function(d){return('0'+d.toString(16)).slice(-2);}).join('');localStorage.setItem('csrf_token',t);}return t;})();
        function sanitize(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
        
        var state={currentUser:null,currentPage:'dashboard',stats:{},pendingTTD:[],disposisiList:[],isOnline:navigator.onLine};
        
        function checkAuth(){
            if(window.EArsip&&window.EArsip.Auth&&window.EArsip.Auth.isAuthenticated){var u=window.EArsip.Auth.currentUser;if(u.role!=='dekan'){window.location.href='../user/index.html';return false;}state.currentUser=u;return true;}
            try{var s=localStorage.getItem('auth_session');if(s){var d=JSON.parse(s);if(d.user&&d.expiresAt&&Date.now()<d.expiresAt){state.currentUser=d.user;return true;}}}catch(e){}
            window.location.href='../../login.html?message=unauthorized';return false;
        }
        
        function showToast(m,t){var c=document.getElementById('toast-container');if(!c)return;var el=document.createElement('div');el.className='toast toast-'+(t||'info');el.textContent=m;c.appendChild(el);setTimeout(function(){el.style.opacity='0';el.style.transition='opacity 0.3s';setTimeout(function(){el.remove();},300);},4000);}
        function formatDate(s){if(!s)return'-';try{var d=new Date(s);if(isNaN(d.getTime()))return s;return d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});}catch(e){return s;}}
        
        function updateNetwork(on){if(on===state.isOnline)return;state.isOnline=on;var b=document.getElementById('network-bar');if(!on){b.className='network-bar offline';document.getElementById('network-msg').textContent='Offline';}else{b.className='network-bar restored';document.getElementById('network-msg').textContent='Koneksi pulih';if(state.currentPage==='dashboard')loadDashboardData();}}
        window.addEventListener('online',function(){updateNetwork(true);});window.addEventListener('offline',function(){updateNetwork(false);});
        if(!navigator.onLine)setTimeout(function(){updateNetwork(false);},1000);
        
        function updateClock(){var n=new Date();var dt=document.getElementById('currentTime');if(dt)dt.textContent=n.toLocaleDateString('id-ID',{weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});var mt=document.getElementById('mobile-time');if(mt)mt.textContent=n.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});}
        
        function navigate(page){
            state.currentPage=page;
            document.querySelectorAll('.sidebar-nav .nav-item[data-page]').forEach(function(l){l.classList.remove('active');if(l.dataset.page===page)l.classList.add('active');});
            var titles={dashboard:'Dashboard Dekan','final-approval':'Final Approval & TTD','disposisi-masuk':'Disposisi Masuk','semua-surat':'Semua Surat',laporan:'Laporan',profile:'Profil'};
            document.getElementById('pageTitle').textContent=titles[page]||'Dashboard';
            switch(page){
                case'dashboard':loadDashboardPage();break;
                case'final-approval':loadFinalApprovalPage();break;
                case'disposisi-masuk':loadDisposisiPage();break;
                case'semua-surat':window.location.href='../../surat-keluar/list.html';break;
                case'laporan':loadLaporanPage();break;
                case'profile':window.location.href='../../profile/index.html';break;
                default:loadDashboardPage();
            }
        }
        
        function loadDashboardPage(){document.getElementById('contentArea').innerHTML='<div style="text-align:center;padding:20px;"><div class="spinner"></div><p>Memuat dashboard...</p></div>';loadDashboardData();}
        
        function loadDashboardData(){
            if(window.EArsip&&window.EArsip.Api){
                window.EArsip.Api.get('dekan/stats',{csrf_token:csrfToken}).then(function(r){if(r&&r.data)state.stats=r.data;else state.stats=getSampleStats();renderDashboard();}).catch(function(){state.stats=getSampleStats();renderDashboard();});
                window.EArsip.Api.get('dekan/pending-ttd',{csrf_token:csrfToken,limit:5}).then(function(r){if(r&&r.data)state.pendingTTD=r.data;else state.pendingTTD=getSampleTTD();renderPendingTTD();}).catch(function(){state.pendingTTD=getSampleTTD();renderPendingTTD();});
            }else{state.stats=getSampleStats();state.pendingTTD=getSampleTTD();renderDashboard();renderPendingTTD();}
        }
        
        function getSampleStats(){return{pendingTTD:7,disetujuiBulanIni:15,disposisiMasuk:4,totalSurat:45};}
        function getSampleTTD(){return[{id:'SK001',nomorSurat:'010/K.UM/FIKOM/VII/2024',perihal:'Undangan Rapat Koordinasi',createdBy:'Staf Akademik',createdAt:new Date().toISOString(),sifat:'biasa'},{id:'SK002',nomorSurat:'011/K.KEU/FIKOM/VII/2024',perihal:'Permohonan Anggaran Workshop',createdBy:'Bendahara',createdAt:new Date(Date.now()-86400000).toISOString(),sifat:'segera'}];}
        
        function renderDashboard(){
            var s=state.stats;
            document.getElementById('contentArea').innerHTML=
                '<div class="stats-grid">'+
                    '<div class="stat-card" onclick="navigateTo(\'final-approval\')"><div class="stat-header"><div><div class="stat-value">'+(s.pendingTTD||0)+'</div><div class="stat-label">Menunggu TTD</div></div><div class="stat-icon" style="background:linear-gradient(135deg,#667eea,#764ba2);"><i class="fas fa-signature"></i></div></div></div>'+
                    '<div class="stat-card"><div class="stat-header"><div><div class="stat-value">'+(s.disetujuiBulanIni||0)+'</div><div class="stat-label">Disetujui Bulan Ini</div></div><div class="stat-icon" style="background:linear-gradient(135deg,#43e97b,#38f9d7);"><i class="fas fa-check-circle"></i></div></div></div>'+
                    '<div class="stat-card" onclick="navigateTo(\'disposisi-masuk\')"><div class="stat-header"><div><div class="stat-value">'+(s.disposisiMasuk||0)+'</div><div class="stat-label">Disposisi Masuk</div></div><div class="stat-icon" style="background:linear-gradient(135deg,#f093fb,#f5576c);"><i class="fas fa-clipboard-list"></i></div></div></div>'+
                    '<div class="stat-card"><div class="stat-header"><div><div class="stat-value">'+(s.totalSurat||0)+'</div><div class="stat-label">Total Surat</div></div><div class="stat-icon" style="background:linear-gradient(135deg,#a8edea,#fed6e3);"><i class="fas fa-envelope"></i></div></div></div>'+
                '</div>'+
                '<div class="card"><div class="card-header"><h5><i class="fas fa-bolt" style="color:var(--gold);"></i> Aksi Cepat</h5></div><div class="card-body"><div class="quick-actions">'+
                    '<button class="btn btn-success" onclick="navigateTo(\'final-approval\')"><i class="fas fa-signature"></i> Tanda Tangan</button>'+
                    '<button class="btn btn-info" onclick="navigateTo(\'disposisi-masuk\')"><i class="fas fa-clipboard-list"></i> Disposisi</button>'+
                    '<button class="btn btn-primary" onclick="navigateTo(\'laporan\')"><i class="fas fa-chart-bar"></i> Laporan</button>'+
                '</div></div></div>'+
                '<div class="card"><div class="card-header"><h5><i class="fas fa-clock" style="color:var(--warning);"></i> Menunggu Tanda Tangan</h5></div><div class="card-body" style="padding:0;" id="pending-ttd-container"><p style="text-align:center;padding:20px;">Memuat...</p></div></div>';
            renderPendingTTD();
        }
        
        function renderPendingTTD(){
            var container=document.getElementById('pending-ttd-container');
            if(!container)return;
            if(state.pendingTTD.length===0){container.innerHTML='<p style="text-align:center;padding:20px;color:#94a3b8;">Tidak ada surat menunggu TTD</p>';return;}
            container.innerHTML=state.pendingTTD.map(function(s){
                return'<div class="signature-card'+(s.sifat==='segera'?' urgent':'')+'"><div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;"><div><strong>'+sanitize(s.perihal||'-')+'</strong><div style="font-size:12px;color:var(--text-light);">No: '+sanitize(s.nomorSurat||'-')+' | Pemohon: '+sanitize(s.createdBy||'-')+' | '+formatDate(s.createdAt)+'</div><div style="margin-top:4px;"><span class="badge badge-success">Admin ✓</span> <span class="badge badge-success">Kasubag ✓</span> <span class="badge badge-success">Wadek ✓</span> <span class="badge badge-warning">Dekan ?</span></div></div><div style="display:flex;gap:4px;"><button class="btn btn-sm btn-success" onclick="openTTDModal(\''+sanitize(s.id)+'\',\''+sanitize(s.nomorSurat||'').replace(/'/g,"\\'")+'\')"><i class="fas fa-signature"></i> TTD</button><a href="../../surat-keluar/preview.html?id='+sanitize(s.id)+'" class="btn btn-sm btn-outline"><i class="fas fa-eye"></i></a></div></div></div>';
            }).join('');
        }
        
        function loadFinalApprovalPage(){
            document.getElementById('contentArea').innerHTML='<div class="card"><div class="card-header"><h5>Final Approval & Tanda Tangan</h5></div><div class="card-body" style="padding:0;"><div class="table-scroll"><table class="data-table"><thead><tr><th>No</th><th>No. Surat</th><th>Perihal</th><th>Pemohon</th><th>Prioritas</th><th>Aksi</th></tr></thead><tbody id="final-table"><tr><td colspan="6" style="text-align:center;">Memuat...</td></tr></tbody></table></div></div></div>';
            if(window.EArsip&&window.EArsip.Api){window.EArsip.Api.get('dekan/pending-ttd',{csrf_token:csrfToken}).then(function(r){if(r&&r.data)state.pendingTTD=r.data;renderFinalTable();}).catch(function(){renderFinalTable();});}else{renderFinalTable();}
        }
        
        function renderFinalTable(){
            var tbody=document.getElementById('final-table');if(!tbody)return;
            if(state.pendingTTD.length===0){tbody.innerHTML='<tr><td colspan="6" style="text-align:center;padding:30px;"><i class="fas fa-check-circle" style="font-size:32px;color:#16a34a;display:block;margin-bottom:8px;"></i>Semua surat sudah diproses</td></tr>';return;}
            tbody.innerHTML=state.pendingTTD.map(function(s,i){return'<tr><td>'+(i+1)+'</td><td><strong>'+sanitize(s.nomorSurat||'-')+'</strong></td><td>'+sanitize(s.perihal||'-')+'</td><td>'+sanitize(s.createdBy||'-')+'</td><td>'+(s.sifat==='segera'?'<span class="badge badge-danger">URGENT</span>':'<span class="badge">Normal</span>')+'</td><td><button class="btn btn-sm btn-success" onclick="openTTDModal(\''+sanitize(s.id)+'\')"><i class="fas fa-signature"></i> TTD</button></td></tr>';}).join('');}
        
        function loadDisposisiPage(){
            document.getElementById('contentArea').innerHTML='<div class="card"><div class="card-header"><h5>Disposisi Masuk - Dekan</h5></div><div class="card-body" style="padding:0;"><div class="table-scroll"><table class="data-table"><thead><tr><th>No</th><th>No. Agenda</th><th>Dari</th><th>Instruksi</th><th>Tanggal</th><th>Status</th></tr></thead><tbody id="disposisi-table"><tr><td colspan="6" style="text-align:center;">Memuat...</td></tr></tbody></table></div></div></div>';
            if(window.EArsip&&window.EArsip.Api){window.EArsip.Api.get('dekan/disposisi',{csrf_token:csrfToken}).then(function(r){if(r&&r.data)state.disposisiList=r.data;else state.disposisiList=getSampleDisposisi();renderDisposisiTable();}).catch(function(){state.disposisiList=getSampleDisposisi();renderDisposisiTable();});}else{state.disposisiList=getSampleDisposisi();renderDisposisiTable();}
        }
        
        function getSampleDisposisi(){return[{id:'D001',nomorAgenda:'M.UM-001',dari:'Wadek I',instruksi:'Mohon ditindaklanjuti untuk akreditasi',createdAt:new Date().toISOString(),status:'Baru'},{id:'D002',nomorAgenda:'M.KEU-001',dari:'Kabag Keuangan',instruksi:'Review anggaran workshop',createdAt:new Date(Date.now()-86400000).toISOString(),status:'Proses'}];}
        
        function renderDisposisiTable(){
            var tbody=document.getElementById('disposisi-table');if(!tbody)return;
            if(state.disposisiList.length===0){tbody.innerHTML='<tr><td colspan="6" style="text-align:center;padding:20px;">Tidak ada disposisi</td></tr>';return;}
            tbody.innerHTML=state.disposisiList.map(function(d,i){return'<tr><td>'+(i+1)+'</td><td><strong>'+sanitize(d.nomorAgenda||'-')+'</strong></td><td>'+sanitize(d.dari||'-')+'</td><td>'+sanitize(d.instruksi||'-')+'</td><td>'+formatDate(d.createdAt)+'</td><td><span class="badge badge-info">'+sanitize(d.status||'-')+'</span></td></tr>';}).join('');}
        
        function loadLaporanPage(){
            document.getElementById('contentArea').innerHTML='<div class="card"><div class="card-header"><h5>Laporan Eksekutif</h5></div><div class="card-body"><div class="stats-grid" style="margin-bottom:20px;"><div class="stat-card" style="text-align:center;"><div class="stat-value">'+(state.stats.totalSurat||45)+'</div><div class="stat-label">Total Surat Tahun Ini</div></div><div class="stat-card" style="text-align:center;"><div class="stat-value">'+(state.stats.disetujuiBulanIni||15)+'</div><div class="stat-label">Disetujui Bulan Ini</div></div><div class="stat-card" style="text-align:center;"><div class="stat-value">'+(state.stats.pendingTTD||7)+'</div><div class="stat-label">Menunggu TTD</div></div></div><button class="btn btn-success" onclick="showToast(\'Laporan akan tersedia di update berikutnya\',\'info\')"><i class="fas fa-download"></i> Export Laporan</button></div></div>';}
        
        function openTTDModal(id,nomorSurat){
            document.getElementById('ttd-nomor-surat').value=id;
            document.getElementById('ttd-modal').classList.add('active');
            document.getElementById('ttd-status').value='';
            document.getElementById('ttd-catatan').value='';
            document.getElementById('ttd-file').value='';
            document.getElementById('ttd-preview').style.display='none';
        }
        
        function closeTTDModal(){document.getElementById('ttd-modal').classList.remove('active');}
        
        function submitTTD(){
            var id=document.getElementById('ttd-nomor-surat').value;
            var status=document.getElementById('ttd-status').value;
            var catatan=document.getElementById('ttd-catatan').value.trim();
            if(!status){showToast('Pilih status','warning');return;}
            if(status==='ditolak'&&!catatan){showToast('Isi alasan penolakan','warning');return;}
            
            var p={action:'finalApprove',id:id,status:status,catatan:catatan,csrf_token:csrfToken};
            if(window.EArsip&&window.EArsip.Api){window.EArsip.Api.post('dekan/approve',p).then(function(r){if(r&&r.success){showToast('Approval final berhasil','success');closeTTDModal();if(state.currentPage==='final-approval')loadFinalApprovalPage();else loadDashboardData();}else showToast(r?.message||'Gagal','error');}).catch(function(){showToast('Gagal','error');});}
            else{setTimeout(function(){showToast('Approval berhasil (simulasi)','success');closeTTDModal();},300);}
        }
        
        function handleLogout(){if(!confirm('Yakin logout?'))return;try{if(window.EArsip&&window.EArsip.Auth)window.EArsip.Auth.logout();}catch(e){}localStorage.removeItem('auth_session');localStorage.removeItem('auth_token');window.location.href='../../login.html?message=logged_out';}
        window.handleLogout=handleLogout;
        window.navigateTo=navigate;
        window.openTTDModal=openTTDModal;
        window.submitTTD=submitTTD;
        
        function init(){
            if(!checkAuth())return;
            setTimeout(function(){document.getElementById('loading-screen').classList.add('hidden');},300);
            if('serviceWorker'in navigator){navigator.serviceWorker.register('../../sw.js').catch(function(){});}
            if(state.currentUser){document.getElementById('displayName').textContent=state.currentUser.fullname||state.currentUser.username||'Dekan';document.getElementById('userAvatar').textContent=(state.currentUser.fullname||'D').charAt(0).toUpperCase();}
            updateClock();setInterval(updateClock,60000);
            document.getElementById('menu-btn').addEventListener('click',function(){document.getElementById('sidebar').classList.toggle('mobile-open');document.getElementById('sidebar-overlay').classList.toggle('active');});
            document.getElementById('sidebar-overlay').addEventListener('click',function(){document.getElementById('sidebar').classList.remove('mobile-open');this.classList.remove('active');});
            document.querySelectorAll('[data-page]').forEach(function(l){l.addEventListener('click',function(e){e.preventDefault();navigate(this.dataset.page);});});
            document.getElementById('ttd-modal-close').addEventListener('click',closeTTDModal);
            document.getElementById('ttd-cancel').addEventListener('click',closeTTDModal);
            document.getElementById('ttd-modal').addEventListener('click',function(e){if(e.target===this)closeTTDModal();});
            document.getElementById('ttd-submit').addEventListener('click',submitTTD);
            document.getElementById('ttd-file').addEventListener('change',function(e){var f=e.target.files[0];if(f){var r=new FileReader();r.onload=function(ev){document.getElementById('ttd-image').src=ev.target.result;document.getElementById('ttd-preview').style.display='block';};r.readAsDataURL(f);}});
            loadDashboardPage();
        }
        if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
    })();
    </script>
</body>
</html>
