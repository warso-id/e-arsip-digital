    <style>
        :root {
            --primary: #0d47a1; --primary-dark: #1565c0; --accent: #1976d2;
            --success: #16a34a; --danger: #dc2626; --warning: #d97706; --info: #0891b2;
            --gold: #ffd700;
            --text: #1e293b; --text-light: #64748b;
            --bg: #f5f6fa; --white: #ffffff; --border: #e2e8f0;
            --radius: 12px; --radius-sm: 8px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
            --transition: all 0.25s ease;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh;
            -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
            padding-bottom: var(--safe-bottom);
        }
        
        /* Network Bar */
        .network-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 9999; padding: 8px; text-align: center; font-size: 12px; font-weight: 600; transform: translateY(-100%); transition: transform 0.3s; }
        .network-bar.offline { transform: translateY(0); background: #fef2f2; color: #dc2626; }
        .network-bar.restored { transform: translateY(0); background: #f0fdf4; color: #16a34a; animation: slideDown 0.3s, slideUp 0.3s 2.5s forwards; }
        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }
        @keyframes slideUp { from { transform: translateY(0); } to { transform: translateY(-100%); } }
        
        /* Loading */
        .loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--white); display: flex; align-items: center; justify-content: center; z-index: 9998; transition: opacity 0.4s; }
        .loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .spinner { width: 44px; height: 44px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Sidebar */
        .sidebar { position: fixed; top: 0; left: 0; width: 260px; height: 100vh; background: linear-gradient(180deg, var(--primary), var(--primary-dark)); color: white; z-index: 100; overflow-y: auto; transition: transform 0.3s; padding-top: var(--safe-top); }
        .sidebar-brand { padding: 22px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-brand .logo { font-size: 36px; color: var(--gold); margin-bottom: 6px; display: block; }
        .sidebar-brand h5 { font-size: 15px; font-weight: 700; margin: 0; }
        .sidebar-brand small { font-size: 11px; opacity: 0.7; }
        .sidebar-nav { padding: 12px 0; }
        .sidebar-nav .nav-item { display: flex; align-items: center; gap: 10px; padding: 12px 22px; color: rgba(255,255,255,0.75); text-decoration: none; font-size: 13px; font-weight: 500; transition: var(--transition); border-left: 3px solid transparent; }
        .sidebar-nav .nav-item:hover { background: rgba(255,255,255,0.08); color: white; }
        .sidebar-nav .nav-item.active { background: rgba(255,255,255,0.12); color: white; border-left-color: var(--gold); font-weight: 600; }
        .sidebar-nav .nav-item i { width: 20px; text-align: center; font-size: 14px; }
        .sidebar-nav .nav-item.logout { color: rgba(255,100,100,0.8); margin-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 16px; }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99; }
        
        /* Main */
        .main-content { margin-left: 260px; min-height: 100vh; padding: 24px; padding-top: calc(24px + var(--safe-top)); transition: margin 0.3s; }
        
        /* Top Bar */
        .top-bar { background: var(--white); padding: 14px 22px; box-shadow: var(--shadow-sm); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
        .top-bar .page-title { font-size: 17px; font-weight: 700; margin: 0; }
        .user-menu { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 38px; height: 38px; background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
        .time-display { font-size: 12px; color: var(--text-light); }
        
        /* Mobile Header */
        .mobile-header { display: none; position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); padding: 10px 16px; border-bottom: 1px solid var(--border); align-items: center; gap: 10px; }
        .mobile-header .hamburger { width: 36px; height: 36px; border: none; background: #f1f5f9; border-radius: 8px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        /* Buttons */
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; font-size: 14px; font-weight: 600; border: none; border-radius: var(--radius-sm); cursor: pointer; text-decoration: none; transition: var(--transition); font-family: inherit; min-height: 44px; -webkit-tap-highlight-color: transparent; }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
        .btn-success { background: var(--success); color: white; }
        .btn-info { background: var(--info); color: white; }
        .btn-sm { padding: 6px 14px; font-size: 12px; min-height: 34px; }
        
        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 20px; }
        .stat-card { background: var(--white); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); transition: var(--transition); cursor: pointer; }
        .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
        .stat-card .stat-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .stat-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: white; }
        .stat-value { font-size: 28px; font-weight: 800; line-height: 1; }
        .stat-label { font-size: 12px; color: var(--text-light); margin-top: 2px; }
        
        /* Card */
        .card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 18px; overflow: hidden; }
        .card-header { padding: 14px 18px; border-bottom: 1px solid var(--border); }
        .card-header h5 { font-size: 15px; font-weight: 600; margin: 0; }
        .card-body { padding: 18px; }
        
        /* Quick Actions */
        .quick-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
        
        /* Table */
        .table-scroll { overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .data-table th { background: #f8fafc; padding: 10px 12px; text-align: left; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-light); border-bottom: 2px solid var(--border); }
        .data-table td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }
        .data-table tr:hover td { background: #f8fafc; }
        
        /* Badges */
        .badge { font-size: 10px; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
        .badge-warning { background: #fef3c7; color: #d97706; }
        .badge-success { background: #dcfce7; color: #16a34a; }
        .badge-info { background: #dbeafe; color: #1d4ed8; }
        .badge-danger { background: #fef2f2; color: #dc2626; }
        
        /* Toast */
        .toast-container { position: fixed; top: calc(12px + var(--safe-top)); right: 12px; z-index: 9999; display: flex; flex-direction: column; gap: 6px; max-width: calc(100vw - 24px); }
        .toast { padding: 10px 16px; border-radius: 10px; color: white; font-size: 13px; font-weight: 500; box-shadow: 0 10px 25px rgba(0,0,0,0.15); animation: slideInRight 0.3s; display: flex; align-items: center; gap: 8px; }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
        .toast-info { background: var(--info); }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 280px; }
            .sidebar.mobile-open { transform: translateX(0); }
            .sidebar-overlay.active { display: block; }
            .main-content { margin-left: 0; padding: 14px; }
            .mobile-header { display: flex; }
            .top-bar { display: none; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <main class="main-content">
        <!-- Top Bar (Desktop) -->

            <div class="user-menu">
                <span class="time-display" id="currentTime"></span>
                <div class="avatar" id="userAvatar">A</div>
                <span style="font-size:14px;font-weight:500;" id="displayName">Admin Kaprodi</span>

    <!-- Scripts -->
    <script src="../../config/config.js"></script>
    <script src="../../js/utils.js"></script>

    <script src="../../js/auth.js"></script>
    
    <script>
    (function() {
        'use strict';
        
        // CSRF Token
        var csrfToken = (function() { var t=localStorage.getItem('csrf_token'); if(!t){var a=new Uint32Array(8);crypto.getRandomValues(a);t=Array.from(a,function(d){return('0'+d.toString(16)).slice(-2);}).join('');localStorage.setItem('csrf_token',t);} return t; })();
        function sanitize(s) { if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML; }
        
        // State
        var state = { currentUser:null, currentPage:'dashboard', stats:{}, recentSurat:[], pendingDisposisi:[], isOnline:navigator.onLine };
        
        // Auth
        function checkAuth() {
            if (window.EArsip && window.EArsip.Auth && window.EArsip.Auth.isAuthenticated) {
                var user = window.EArsip.Auth.currentUser;
                if (user.role !== 'admin_kaprodi') { window.location.href = '../user/index.html'; return false; }
                state.currentUser = user; return true;
            }
            try {
                var s = localStorage.getItem('auth_session');
                if (s) { var d = JSON.parse(s); if (d.user && d.expiresAt && Date.now() < d.expiresAt) { state.currentUser = d.user; return true; } }
            } catch(e) {}
            window.location.href = '../../login.html?message=unauthorized'; return false;
        }
        
        // Toast
        function showToast(m,t) { var c=document.getElementById('toast-container'); if(!c)return; var el=document.createElement('div'); el.className='toast toast-'+(t||'info'); el.textContent=m; c.appendChild(el); setTimeout(function(){el.style.opacity='0';el.style.transition='opacity 0.3s';setTimeout(function(){el.remove();},300);},4000); }
        
        // Format
        function formatDate(s) { if(!s)return'-'; try{var d=new Date(s);if(isNaN(d.getTime()))return s;return d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});}catch(e){return s;} }
        function timeAgo(s) { if(!s)return'-'; try{var d=new Date(s);var diff=Math.floor((Date.now()-d.getTime())/1000);if(diff<60)return'Baru saja';if(diff<3600)return Math.floor(diff/60)+' menit lalu';if(diff<86400)return Math.floor(diff/3600)+' jam lalu';return formatDate(s);}catch(e){return s;} }
        
        // Network
        function updateNetwork(on) { if(on===state.isOnline)return;state.isOnline=on;var b=document.getElementById('network-bar');if(!on){b.className='network-bar offline';document.getElementById('network-msg').textContent='Offline';}else{b.className='network-bar restored';document.getElementById('network-msg').textContent='Koneksi pulih';loadDashboardData();} }
        window.addEventListener('online',function(){updateNetwork(true);});window.addEventListener('offline',function(){updateNetwork(false);});if(!navigator.onLine)setTimeout(function(){updateNetwork(false);},1000);
        
        // Clock
        function updateClock() { var now=new Date();var str=now.toLocaleDateString('id-ID',{weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});var dt=document.getElementById('currentTime');if(dt)dt.textContent=str;var mt=document.getElementById('mobile-time');if(mt)mt.textContent=now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); }
        
        // ============ NAVIGATION ============
        function navigate(page) {
            state.currentPage = page;
            document.querySelectorAll('.sidebar-nav .nav-item[data-page]').forEach(function(l) { l.classList.remove('active'); if(l.dataset.page===page)l.classList.add('active'); });
            var titles = { dashboard:'Dashboard Admin Kaprodi', 'surat-masuk':'Surat Masuk', 'surat-keluar':'Surat Keluar', disposisi:'Disposisi', laporan:'Laporan', profile:'Profil' };
            document.getElementById('pageTitle').textContent = titles[page] || 'Dashboard';
            
            switch(page) {
                case 'dashboard': loadDashboardPage(); break;
                case 'disposisi': loadDisposisiPage(); break;
                case 'surat-masuk': window.location.href = '../../surat-masuk/list.html'; break;
                case 'surat-keluar': window.location.href = '../../surat-keluar/list.html'; break;
                case 'laporan': window.location.href = '../../laporan/index.html'; break;
                case 'profile': window.location.href = '../../profile/index.html'; break;
                default: loadDashboardPage();
            }
        }
        
        // ============ DASHBOARD ============
        function loadDashboardPage() {
            var content = document.getElementById('contentArea');
            content.innerHTML = '<div style="text-align:center;padding:20px;"><div class="spinner" style="margin:0 auto;"></div><p style="color:var(--text-light);margin-top:8px;">Memuat dashboard...</p></div>';
            loadDashboardData();
        }
        
        function loadDashboardData() {
            if (window.EArsip && window.EArsip.Api) {
                window.EArsip.Api.get('admin-kaprodi/stats', { csrf_token:csrfToken }).then(function(r) { if(r&&r.data)state.stats=r.data; else state.stats=getSampleStats(); renderDashboard(); }).catch(function() { state.stats=getSampleStats(); renderDashboard(); });
                window.EArsip.Api.get('admin-kaprodi/recent-surat', { csrf_token:csrfToken, limit:5 }).then(function(r) { if(r&&r.data)state.recentSurat=r.data; else state.recentSurat=getSampleSurat(); renderRecentTable(); }).catch(function() { state.recentSurat=getSampleSurat(); renderRecentTable(); });
            } else { state.stats=getSampleStats(); state.recentSurat=getSampleSurat(); renderDashboard(); renderRecentTable(); }
        }
        
        function getSampleStats() { return { suratMasuk:8, pending:3, disposisi:5, selesai:10 }; }
        function getSampleSurat() {
            return [
                { id:'SM001', nomor_agenda:'M.UM-001', nomor_surat:'421.5/1234/DP/2024', perihal:'Pemberitahuan Akreditasi', pengirim:'Dinas Pendidikan', tgl_terima:new Date().toISOString(), status_disposisi:'proses' },
                { id:'SM002', nomor_agenda:'M.UM-002', nomor_surat:'B-456/UN/2024', perihal:'Edaran Akademik', pengirim:'Rektorat', tgl_terima:new Date(Date.now()-86400000).toISOString(), status_disposisi:'belum' },
                { id:'SK001', nomor_surat:'010/K.UM/FIKOM/VII/2024', perihal:'Undangan Rapat Koordinasi', pengaju:'Staf', tanggal:new Date().toISOString(), status:'pending_kaprodi' }
            ];
        }
        
        function renderDashboard() {
            var s = state.stats;
            document.getElementById('contentArea').innerHTML =
                '<div class="stats-grid">'+
                    '<div class="stat-card" onclick="navigateTo(\'surat-masuk\')"><div class="stat-header"><div><div class="stat-value">'+(s.suratMasuk||0)+'</div><div class="stat-label">Surat Masuk</div></div><div class="stat-icon" style="background:linear-gradient(135deg,#0d47a1,#1565c0);"><i class="fas fa-inbox"></i></div></div></div>'+
                    '<div class="stat-card"><div class="stat-header"><div><div class="stat-value">'+(s.pending||0)+'</div><div class="stat-label">Pending</div></div><div class="stat-icon" style="background:linear-gradient(135deg,#1976d2,#1e88e5);"><i class="fas fa-clock"></i></div></div></div>'+
                    '<div class="stat-card" onclick="navigateTo(\'disposisi\')"><div class="stat-header"><div><div class="stat-value">'+(s.disposisi||0)+'</div><div class="stat-label">Disposisi</div></div><div class="stat-icon" style="background:linear-gradient(135deg,#42a5f5,#64b5f6);"><i class="fas fa-clipboard-list"></i></div></div></div>'+
                    '<div class="stat-card"><div class="stat-header"><div><div class="stat-value">'+(s.selesai||0)+'</div><div class="stat-label">Selesai</div></div><div class="stat-icon" style="background:linear-gradient(135deg,#90caf9,#bbdefb);"><i class="fas fa-check-circle"></i></div></div></div>'+
                '</div>'+
                '<div class="card"><div class="card-header"><h5><i class="fas fa-bolt" style="color:var(--gold);margin-right:6px;"></i> Aksi Cepat</h5></div><div class="card-body"><div class="quick-actions">'+
                    '<button class="btn btn-primary" onclick="navigateTo(\'surat-masuk\')"><i class="fas fa-inbox"></i> Kelola Surat Masuk</button>'+
                    '<button class="btn btn-success" onclick="navigateTo(\'surat-keluar\')"><i class="fas fa-paper-plane"></i> Kelola Surat Keluar</button>'+
                    '<button class="btn btn-info" onclick="navigateTo(\'disposisi\')"><i class="fas fa-clipboard-list"></i> Disposisi</button>'+
                '</div></div></div>'+
                '<div class="card"><div class="card-header"><h5><i class="fas fa-history" style="color:var(--primary);margin-right:6px;"></i> Surat Terbaru</h5></div><div class="card-body" style="padding:0;"><div class="table-scroll"><table class="data-table"><thead><tr><th>No. Agenda/Surat</th><th>Perihal</th><th>Pengirim/Pengaju</th><th>Tanggal</th><th>Status</th></tr></thead><tbody id="recent-table-body"><tr><td colspan="5" style="text-align:center;">Memuat...</td></tr></tbody></table></div></div></div>';
            renderRecentTable();
        }
        
        function renderRecentTable() {
            var tbody = document.getElementById('recent-table-body');
            if (!tbody) return;
            if (state.recentSurat.length === 0) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:#94a3b8;">Belum ada surat</td></tr>'; return; }
            
            tbody.innerHTML = state.recentSurat.map(function(s) {
                var nomor = s.nomor_agenda || s.nomor_surat || '-';
                var pengirim = s.pengirim || s.pengaju || '-';
                var tanggal = s.tgl_terima || s.tanggal || s.createdAt;
                var status = s.status_disposisi || s.status || '-';
                var badgeClass = status==='selesai'||status==='completed'?'badge-success':status==='proses'||status==='pending'?'badge-warning':'badge-info';
                return '<tr><td><strong>'+sanitize(nomor)+'</strong></td><td>'+sanitize(s.perihal||'-')+'</td><td>'+sanitize(pengirim)+'</td><td>'+formatDate(tanggal)+'</td><td><span class="badge '+badgeClass+'">'+sanitize(status)+'</span></td></tr>';
            }).join('');
        }
        
        // ============ DISPOSISI PAGE ============
        function loadDisposisiPage() {
            var content = document.getElementById('contentArea');
            content.innerHTML = '<div style="text-align:center;padding:20px;"><div class="spinner" style="margin:0 auto;"></div><p>Memuat disposisi...</p></div>';
            
            if (window.EArsip && window.EArsip.Api) {
                window.EArsip.Api.get('admin-kaprodi/pending-disposisi', { csrf_token:csrfToken }).then(function(r) { if(r&&r.data)state.pendingDisposisi=r.data; else state.pendingDisposisi=getSampleDisposisi(); renderDisposisiPage(); }).catch(function() { state.pendingDisposisi=getSampleDisposisi(); renderDisposisiPage(); });
            } else { state.pendingDisposisi = getSampleDisposisi(); renderDisposisiPage(); }
        }
        
        function getSampleDisposisi() {
            return [
                { id:'DISP001', nomor_surat:'M.UM-001', dari:'Dekan', kepada:'Kaprodi TI', instruksi:'Mohon ditindaklanjuti', batas_waktu:new Date(Date.now()+259200000).toISOString(), status:'proses' },
                { id:'DISP002', nomor_surat:'M.KEU-001', dari:'Wadek II', kepada:'Kaprodi SI', instruksi:'Siapkan laporan', batas_waktu:new Date(Date.now()+86400000).toISOString(), status:'pending' }
            ];
        }
        
        function renderDisposisiPage() {
            var content = document.getElementById('contentArea');
            content.innerHTML = '<div class="card"><div class="card-header"><h5><i class="fas fa-clipboard-list" style="color:var(--primary);margin-right:6px;"></i> Disposisi Masuk</h5></div><div class="card-body" style="padding:0;"><div class="table-scroll"><table class="data-table"><thead><tr><th>No. Surat</th><th>Dari</th><th>Instruksi</th><th>Batas Waktu</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="disposisi-table-body">'+
                (state.pendingDisposisi.length === 0 ? '<tr><td colspan="6" style="text-align:center;padding:30px;color:#94a3b8;"><i class="fas fa-check-circle" style="font-size:32px;color:#16a34a;display:block;margin-bottom:8px;"></i>Tidak ada disposisi pending</td></tr>' : '')+
            '</tbody></table></div></div></div>';
            
            var tbody = document.getElementById('disposisi-table-body');
            if (!tbody || state.pendingDisposisi.length === 0) return;
            
            tbody.innerHTML = state.pendingDisposisi.map(function(d) {
                var isOverdue = new Date(d.batas_waktu) < new Date();
                return '<tr>'+
                    '<td><strong>'+sanitize(d.nomor_surat||'-')+'</strong></td>'+
                    '<td>'+sanitize(d.dari||'-')+'</td>'+
                    '<td>'+sanitize(d.instruksi||'-')+'</td>'+
                    '<td><span style="color:'+(isOverdue?'var(--danger)':'var(--text))+';">'+formatDate(d.batas_waktu)+(isOverdue?' (Terlambat)':'')+'</span></td>'+
                    '<td><span class="badge '+(d.status==='selesai'?'badge-success':'badge-warning')+'">'+sanitize(d.status||'-')+'</span></td>'+
                    '<td><a href="../../surat-masuk/disposisi.html?id='+sanitize(d.id)+'" class="btn btn-sm btn-outline"><i class="fas fa-eye"></i> Lihat</a></td>'+
                '</tr>';
            }).join('');
        }
        
        // ============ LOGOUT ============
        function handleLogout() {
            if (!confirm('Apakah Anda yakin ingin logout?')) return;
            try { if (window.EArsip && window.EArsip.Auth) window.EArsip.Auth.logout(); } catch(e) {}
            localStorage.removeItem('auth_session'); localStorage.removeItem('auth_token');
            window.location.href = '../../login.html?message=logged_out';
        }
        window.handleLogout = handleLogout;
        window.navigateTo = navigate;
        
        // ============ INIT ============
        function init() {
            if (!checkAuth()) return;
            setTimeout(function() { document.getElementById('loading-screen').classList.add('hidden'); },300);
            if ('serviceWorker' in navigator) { navigator.serviceWorker.register('../../sw.js').catch(function(){}); }
            
            if (state.currentUser) {
                document.getElementById('displayName').textContent = state.currentUser.fullname || state.currentUser.username || 'Admin Kaprodi';
                document.getElementById('userAvatar').textContent = (state.currentUser.fullname || 'A').charAt(0).toUpperCase();
            }
            
            updateClock(); setInterval(updateClock, 60000);
            
            document.getElementById('menu-btn').addEventListener('click', function() { document.getElementById('sidebar').classList.toggle('mobile-open'); document.getElementById('sidebar-overlay').classList.toggle('active'); });
            document.getElementById('sidebar-overlay').addEventListener('click', function() { document.getElementById('sidebar').classList.remove('mobile-open'); this.classList.remove('active'); });
            document.querySelectorAll('[data-page]').forEach(function(l) { l.addEventListener('click', function(e) { e.preventDefault(); navigate(this.dataset.page); }); });
            
            loadDashboardPage();
        }
        
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
    })();
    </script>
</body>
</html>
