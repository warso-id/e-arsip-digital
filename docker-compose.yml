# docker-compose.yml - E-Arsip Digital 2026
# Production-ready Docker Compose configuration

version: '3.9'

# ============================================
# NETWORKS
# ============================================
networks:
  frontend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-e-arsip-front
  backend:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-e-arsip-back

# ============================================
# VOLUMES
# ============================================
volumes:
  app_data:
    name: e-arsip-data
  app_uploads:
    name: e-arsip-uploads
  app_backups:
    name: e-arsip-backups
  nginx_logs:
    name: e-arsip-nginx-logs
  certbot_data:
    name: e-arsip-certbot

# ============================================
# SERVICES
# ============================================
services:
  # Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: e-arsip-app
    restart: unless-stopped
    networks:
      - frontend
    volumes:
      - app_uploads:/usr/share/nginx/html/uploads
      - app_backups:/usr/share/nginx/html/backups
      - nginx_logs:/var/log/nginx
    environment:
      - TZ=Asia/Jakarta
      - NODE_ENV=production
      - APP_VERSION=2026.1.0
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # SSL/TLS Termination (optional - for production with HTTPS)
  certbot:
    image: certbot/certbot:latest
    container_name: e-arsip-certbot
    restart: unless-stopped
    networks:
      - frontend
    volumes:
      - certbot_data:/etc/letsencrypt
      - app_data:/var/www/html
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    profiles:
      - production
      - ssl

  # Redis for session storage (optional)
  redis:
    image: redis:7-alpine
    container_name: e-arsip-redis
    restart: unless-stopped
    networks:
      - backend
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    profiles:
      - production
      - with-redis

  # Development server
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: e-arsip-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - frontend
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - TZ=Asia/Jakarta
      - NODE_ENV=development
      - HOT_RELOAD=true
    stdin_open: true
    tty: true
    profiles:
      - development

  # Static file server for testing
  static:
    image: nginx:1.27-alpine
    container_name: e-arsip-static
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - frontend
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    profiles:
      - testing
      - preview

# ============================================
# VOLUME DEFINITIONS
# ============================================
volumes:
  redis_data:
    name: e-arsip-redis-data