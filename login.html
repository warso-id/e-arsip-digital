<!-- login.html - Login Page 2026 (FINAL FIXED) -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="Login ke Sistem E-Arsip Digital">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- CSP - Allow Google Scripts & CDN -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://cdn.jsdelivr.net https://script.google.com https://script.googleusercontent.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://script.google.com https://script.googleusercontent.com; form-action 'self'; base-uri 'self';">
    
    <title>Login - E-Arsip Digital</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --error: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --text: #1e293b;
            --text-light: #64748b;
            --bg: #ffffff;
            --bg-light: #f8fafc;
            --border: #e2e8f0;
            --radius: 12px;
            --radius-sm: 8px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        
        .login-container { width: 100%; max-width: 420px; }
        
        .login-card {
            background: var(--bg); border-radius: var(--radius);
            box-shadow: 0 20px 60px rgba(0,0,0,0.2); padding: 36px 32px;
            position: relative; overflow: hidden;
        }
        .login-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--primary), #764ba2);
        }
        
        .login-header { text-align: center; margin-bottom: 28px; }
        .login-logo {
            width: 72px; height: 72px; margin: 0 auto 14px;
            background: linear-gradient(135deg, var(--primary), #764ba2);
            border-radius: 18px; display: flex; align-items: center; justify-content: center;
            font-size: 32px; color: white;
        }
        .login-title { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
        .login-subtitle { font-size: 13px; color: var(--text-light); }
        
        .status-bar {
            text-align: center; padding: 8px 12px; margin-bottom: 18px;
            border-radius: 8px; font-size: 12px; font-weight: 500;
        }
        .status-bar.checking { background: #f8fafc; color: #64748b; }
        .status-bar.online { background: #f0fdf4; color: #16a34a; }
        .status-bar.error { background: #fef2f2; color: #dc2626; }
        
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
        
        .input-wrap { position: relative; }
        .input-wrap .icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: #94a3b8; font-size: 15px; pointer-events: none;
        }
        
        .form-input {
            width: 100%; padding: 12px 14px 12px 42px;
            font-size: 14px; border: 2px solid var(--border); border-radius: var(--radius-sm);
            background: var(--bg-light); color: var(--text); outline: none;
            transition: all 0.2s; font-family: inherit;
        }
        .form-input:focus { border-color: var(--primary); background: var(--bg); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        
        .toggle-pw {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; font-size: 16px; color: #94a3b8;
        }
        
        .alert {
            padding: 10px 14px; border-radius: 8px; margin-bottom: 16px;
            font-size: 13px; display: none; align-items: center; gap: 8px;
        }
        .alert.show { display: flex; }
        .alert.error { background: #fef2f2; color: var(--error); border: 1px solid #fecaca; }
        .alert.success { background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; }
        .alert.warning { background: #fffbeb; color: var(--warning); border: 1px solid #fde68a; }
        
        .btn-login {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; border: none; border-radius: var(--radius-sm);
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; font-family: inherit;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-login:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.4); }
        .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .spinner {
            display: none; width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
            border-radius: 50%; animation: spin 0.6s linear infinite;
        }
        .btn-login.loading .spinner { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .footer-text { text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-light); }
        .footer-text strong { color: var(--text); }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">📁</div>
                <h1 class="login-title">E-Arsip Digital</h1>
                <p class="login-subtitle">Masuk ke sistem manajemen arsip digital</p>
            </div>
            
            <div class="status-bar checking" id="status-bar">🔄 Mengecek koneksi...</div>
            
            <div class="alert error" id="alert-error"><span>❌</span> <span id="msg-error"></span></div>
            <div class="alert success" id="alert-success"><span>✅</span> <span id="msg-success"></span></div>
            <div class="alert warning" id="alert-warning"><span>⚠️</span> <span id="msg-warning"></span></div>
            
            <form id="login-form" autocomplete="on">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <div class="input-wrap">
                        <span class="icon">👤</span>
                        <input type="text" id="username" class="form-input" placeholder="Masukkan username" autocomplete="username" required autofocus>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-wrap">
                        <span class="icon">🔒</span>
                        <input type="password" id="password" class="form-input" placeholder="Masukkan password" autocomplete="current-password" required>
                        <button type="button" class="toggle-pw" id="toggle-pw">👁️</button>
                    </div>
                </div>
                
                <button type="submit" class="btn-login" id="btn-login">
                    <span id="btn-text">Masuk</span>
                    <span class="spinner"></span>
                </button>
            </form>
            
            <div class="footer-text">
                <p>Default: <strong>admin</strong> / <strong>admin123</strong></p>
                <p style="margin-top:4px;font-size:10px;">v2026.1.0</p>
            </div>
        </div>
    </div>
    
    <script>
    (function() {
        'use strict';
        
        // ⬇️ GOOGLE APPS SCRIPT URL
        var API_URL = 'https://script.google.com/macros/s/AKfycbxP0G4klL8Ruqu_XFQ8YMYGy-jFyqb8r0mYc5WprLGTq2qdX0mucljUd9sxwokUtJ-d/exec';
        
        var loginForm = document.getElementById('login-form');
        var usernameInput = document.getElementById('username');
        var passwordInput = document.getElementById('password');
        var btnLogin = document.getElementById('btn-login');
        var btnText = document.getElementById('btn-text');
        var togglePw = document.getElementById('toggle-pw');
        var statusBar = document.getElementById('status-bar');
        var alertError = document.getElementById('alert-error');
        var alertSuccess = document.getElementById('alert-success');
        var alertWarning = document.getElementById('alert-warning');
        var msgError = document.getElementById('msg-error');
        var msgSuccess = document.getElementById('msg-success');
        var msgWarning = document.getElementById('msg-warning');
        
        var loginAttempts = 0;
        var maxAttempts = 5;
        
        // ============================================
        // INIT
        // ============================================
        function init() {
            console.log('Login page v2026.1.0');
            
            // Check existing session
            checkExistingSession();
            
            // Check server connection
            checkServerConnection();
            
            // Events
            loginForm.addEventListener('submit', handleLogin);
            togglePw.addEventListener('click', function() {
                var isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                togglePw.textContent = isPassword ? '🙈' : '👁️';
            });
            
            // Load saved username
            loadSavedUsername();
            
            // Focus
            setTimeout(function() { usernameInput.focus(); }, 600);
        }
        
        // ============================================
        // CHECK EXISTING SESSION
        // ============================================
        function checkExistingSession() {
            try {
                var session = localStorage.getItem('auth_session');
                if (session) {
                    var data = JSON.parse(session);
                    if (data.user && data.expiresAt && Date.now() < data.expiresAt) {
                        redirectToDashboard(data.user.role);
                    }
                }
            } catch(e) {}
        }
        
        // ============================================
        // CHECK SERVER CONNECTION
        // ============================================
        function checkServerConnection() {
            setStatus('checking', 'Mengecek koneksi ke server...');
            
            // ⬇️ GUNAKAN XMLHttpRequest (lebih kompatibel dengan Google Apps Script)
            var xhr = new XMLHttpRequest();
            xhr.open('GET', API_URL + '?action=health', true);
            xhr.timeout = 10000;
            
            xhr.onload = function() {
                try {
                    var data = JSON.parse(xhr.responseText);
                    if (data.success) {
                        setStatus('online', '✅ Server terhubung (v' + (data.version || '?') + ')');
                    } else {
                        setStatus('error', '⚠️ Server merespon dengan error');
                    }
                } catch(e) {
                    // Response bukan JSON - coba POST
                    checkWithPost();
                }
            };
            
            xhr.onerror = function() {
                checkWithPost();
            };
            
            xhr.ontimeout = function() {
                checkWithPost();
            };
            
            xhr.send();
        }
        
        function checkWithPost() {
            // ⬇️ FALLBACK: Coba dengan POST
            fetch(API_URL, {
                method: 'POST',
                mode: 'cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'health' })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.success) {
                    setStatus('online', '✅ Server terhubung');
                } else {
                    setStatus('error', '⚠️ Server error: ' + (data.error || 'unknown'));
                }
            })
            .catch(function() {
                setStatus('error', '⚠️ Server tidak terjangkau - login via POST tetap bisa dicoba');
            });
        }
        
        function setStatus(type, message) {
            statusBar.className = 'status-bar ' + type;
            statusBar.textContent = message;
        }
        
        // ============================================
        // HANDLE LOGIN
        // ============================================
        function handleLogin(event) {
            event.preventDefault();
            
            var username = usernameInput.value.trim();
            var password = passwordInput.value;
            
            // Validasi
            if (!username || username.length < 3) {
                showAlert('warning', 'Username minimal 3 karakter');
                usernameInput.focus();
                return;
            }
            if (!password || password.length < 6) {
                showAlert('warning', 'Password minimal 6 karakter');
                passwordInput.focus();
                return;
            }
            
            if (loginAttempts >= maxAttempts) {
                showAlert('error', 'Akun terkunci. Silakan coba lagi nanti.');
                return;
            }
            
            // Sembunyikan alert
            hideAllAlerts();
            
            // Loading
            setLoading(true);
            
            // ⬇️ KIRIM REQUEST KE GOOGLE APPS SCRIPT
            var requestData = {
                action: 'login',
                username: username,
                password: password
            };
            
            console.log('Login request:', requestData);
            
            // ⬇️ GUNAKAN FETCH DENGAN MODE CORS
            fetch(API_URL, {
                method: 'POST',
                mode: 'cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestData)
            })
            .then(function(response) {
                console.log('Response status:', response.status, response.statusText);
                
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status + ': ' + response.statusText);
                }
                
                // ⬇️ BACA SEBAGAI TEXT DULU
                return response.text();
            })
            .then(function(text) {
                console.log('Raw response:', text.substring(0, 300));
                
                // ⬇️ COBA PARSE JSON
                var data;
                try {
                    data = JSON.parse(text);
                } catch(e) {
                    // Mungkin response terbungkus string
                    try {
                        var unescaped = text.replace(/^"|"$/g, '').replace(/\\"/g, '"');
                        data = JSON.parse(unescaped);
                    } catch(e2) {
                        throw new Error('Response bukan JSON: ' + text.substring(0, 100));
                    }
                }
                
                console.log('Parsed response:', data);
                
                // ⬇️ CEK RESPONSE
                if (data.success === false) {
                    throw new Error(data.error || 'Login gagal');
                }
                
                // ⬇️ AMBIL DATA USER
                var userData = data.data || data;
                
                if (!userData.token || !userData.user) {
                    throw new Error('Response tidak valid: token/user tidak ditemukan. Response: ' + JSON.stringify(data).substring(0, 200));
                }
                
                // Login berhasil
                handleLoginSuccess(userData);
            })
            .catch(function(error) {
                console.error('Login error:', error);
                handleLoginError(error);
            })
            .finally(function() {
                setLoading(false);
            });
        }
        
        function handleLoginSuccess(data) {
            console.log('Login success:', data.user.username, 'Role:', data.user.role);
            
            // Simpan session
            var sessionData = {
                token: data.token,
                refreshToken: data.refreshToken || '',
                user: data.user,
                expiresAt: Date.now() + 3600000,
                lastActivity: Date.now()
            };
            
            try {
                localStorage.setItem('auth_session', JSON.stringify(sessionData));
                localStorage.setItem('auth_token', data.token);
                if (data.refreshToken) {
                    localStorage.setItem('auth_refresh_token', data.refreshToken);
                }
            } catch(e) {
                console.warn('Storage full:', e);
            }
            
            showAlert('success', 'Login berhasil! Mengalihkan...');
            
            setTimeout(function() {
                redirectToDashboard(data.user.role);
            }, 600);
        }
        
        function handleLoginError(error) {
            loginAttempts++;
            console.warn('Login failed (' + loginAttempts + '/' + maxAttempts + '):', error.message);
            
            var remaining = maxAttempts - loginAttempts;
            
            if (remaining <= 0) {
                showAlert('error', 'Akun terkunci. Coba lagi nanti.');
                btnLogin.disabled = true;
                setTimeout(function() {
                    loginAttempts = 0;
                    btnLogin.disabled = false;
                }, 300000);
            } else if (remaining <= 2) {
                showAlert('warning', 'Login gagal. Sisa percobaan: ' + remaining);
            } else {
                showAlert('error', error.message || 'Login gagal. Periksa username dan password.');
            }
            
            passwordInput.value = '';
            passwordInput.focus();
        }
        
        // ============================================
        // UI HELPERS
        // ============================================
        function setLoading(loading) {
            btnLogin.disabled = loading;
            if (loading) {
                btnLogin.classList.add('loading');
                btnText.textContent = 'Memproses...';
            } else {
                btnLogin.classList.remove('loading');
                btnText.textContent = 'Masuk';
            }
        }
        
        function showAlert(type, message) {
            hideAllAlerts();
            
            if (type === 'error') { msgError.textContent = message; alertError.classList.add('show'); }
            else if (type === 'success') { msgSuccess.textContent = message; alertSuccess.classList.add('show'); }
            else if (type === 'warning') { msgWarning.textContent = message; alertWarning.classList.add('show'); }
        }
        
        function hideAllAlerts() {
            [alertError, alertSuccess, alertWarning].forEach(function(el) {
                el.classList.remove('show');
            });
        }
        
        function loadSavedUsername() {
            try {
                var saved = localStorage.getItem('saved_username');
                if (saved) usernameInput.value = saved;
            } catch(e) {}
        }
        
        // ============================================
        // NAVIGATION
        // ============================================
        function redirectToDashboard(role) {
            var routes = {
                'super_admin': 'dashboard/super-admin/index.html',
                'admin': 'dashboard/admin/index.html',
                'kaprodi': 'dashboard/kaprodi/index.html',
                'wadek': 'dashboard/wadek/index.html',
                'dekan': 'dashboard/dekan/index.html',
                'staf': 'dashboard/staf/index.html',
                'dosen': 'dashboard/dosen/index.html',
                'mahasiswa': 'dashboard/mahasiswa/index.html',
                'user': 'dashboard/user/index.html'
            };
            
            var url = routes[role] || 'dashboard/';
            window.location.href = url;
        }
        
        // Start
        init();
    })();
    </script>
</body>
</html>
