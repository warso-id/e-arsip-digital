<!-- login.html - Login Page 2026 (FINAL - NO CORS ISSUE) -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="Login ke Sistem E-Arsip Digital">
    <meta name="robots" content="noindex, nofollow">
    
    <title>Login - E-Arsip Digital</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --error: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --text: #1e293b;
            --text-light: #64748b;
            --bg: #ffffff;
            --bg-light: #f8fafc;
            --border: #e2e8f0;
            --radius: 16px;
            --radius-sm: 10px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        
        .login-container { width: 100%; max-width: 420px; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .login-card {
            background: var(--bg); border-radius: var(--radius);
            box-shadow: 0 20px 60px rgba(0,0,0,0.2); padding: 36px 30px;
            position: relative; overflow: hidden;
        }
        .login-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--primary), #764ba2);
        }
        
        .login-header { text-align: center; margin-bottom: 28px; }
        .login-logo {
            width: 72px; height: 72px; margin: 0 auto 14px;
            background: linear-gradient(135deg, var(--primary), #764ba2);
            border-radius: 18px; display: flex; align-items: center; justify-content: center;
            font-size: 34px; color: white;
        }
        .login-title { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
        .login-subtitle { font-size: 13px; color: var(--text-light); }
        
        .status-bar {
            text-align: center; padding: 8px 12px; margin-bottom: 16px;
            border-radius: 8px; font-size: 12px; font-weight: 500;
            transition: all 0.3s;
        }
        .status-bar.checking { background: #f8fafc; color: #64748b; }
        .status-bar.online { background: #f0fdf4; color: #16a34a; }
        .status-bar.error { background: #fef2f2; color: #dc2626; }
        
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
        
        .input-wrap { position: relative; }
        .input-wrap .icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: #94a3b8; font-size: 15px; pointer-events: none; z-index: 1;
        }
        
        .form-input {
            width: 100%; padding: 13px 14px 13px 42px;
            font-size: 14px; border: 2px solid var(--border); border-radius: var(--radius-sm);
            background: var(--bg-light); color: var(--text); outline: none;
            transition: all 0.2s; font-family: inherit;
        }
        .form-input:focus { border-color: var(--primary); background: var(--bg); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        
        .toggle-pw {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; font-size: 16px; color: #94a3b8;
            padding: 4px;
        }
        
        .alert {
            padding: 10px 14px; border-radius: 8px; margin-bottom: 14px;
            font-size: 13px; display: none; align-items: center; gap: 8px;
        }
        .alert.show { display: flex; }
        .alert.error { background: #fef2f2; color: var(--error); border: 1px solid #fecaca; }
        .alert.success { background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; }
        .alert.warning { background: #fffbeb; color: var(--warning); border: 1px solid #fde68a; }
        
        .btn-login {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; border: none; border-radius: var(--radius-sm);
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; font-family: inherit;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-login:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.4); }
        .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .spinner {
            display: none; width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
            border-radius: 50%; animation: spin 0.6s linear infinite;
        }
        .btn-login.loading .spinner { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .footer-text { text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-light); }
        .footer-text strong { color: var(--text); }
    </style>
</head>
<body>
    <!-- Hidden iframe untuk menerima response dari Google Apps Script -->
    <iframe name="hidden-iframe" id="hidden-iframe" style="display:none;width:0;height:0;border:0;"></iframe>
    
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">📁</div>
                <h1 class="login-title">E-Arsip Digital</h1>
                <p class="login-subtitle">Masuk ke sistem manajemen arsip digital</p>
            </div>
            
            <div class="status-bar checking" id="status-bar">🔄 Mengecek koneksi...</div>
            
            <div class="alert error" id="alert-error"><span>❌</span> <span id="msg-error"></span></div>
            <div class="alert success" id="alert-success"><span>✅</span> <span id="msg-success"></span></div>
            <div class="alert warning" id="alert-warning"><span>⚠️</span> <span id="msg-warning"></span></div>
            
            <!-- ⬇️ FORM LANGSUNG SUBMIT KE GOOGLE APPS SCRIPT -->
            <form id="login-form" autocomplete="on" method="POST" 
                  action="https://script.google.com/macros/s/AKfycbxP0G4klL8Ruqu_XFQ8YMYGy-jFyqb8r0mYc5WprLGTq2qdX0mucljUd9sxwokUtJ-d/exec"
                  target="hidden-iframe">
                
                <!-- ⬇️ HIDDEN INPUT UNTUK ACTION -->
                <input type="hidden" name="action" value="login">
                
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <div class="input-wrap">
                        <span class="icon">👤</span>
                        <input type="text" id="username" name="username" class="form-input" 
                               placeholder="Masukkan username" autocomplete="username" required autofocus>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-wrap">
                        <span class="icon">🔒</span>
                        <input type="password" id="password" name="password" class="form-input" 
                               placeholder="Masukkan password" autocomplete="current-password" required>
                        <button type="button" class="toggle-pw" id="toggle-pw">👁️</button>
                    </div>
                </div>
                
                <button type="submit" class="btn-login" id="btn-login">
                    <span id="btn-text">Masuk</span>
                    <span class="spinner"></span>
                </button>
            </form>
            
            <div class="footer-text">
                <p>Default: <strong>admin</strong> / <strong>admin123</strong></p>
                <p style="margin-top:4px;font-size:10px;">v2026.1.0</p>
            </div>
        </div>
    </div>
    
    <script>
    (function() {
        'use strict';
        
        var API_URL = 'https://script.google.com/macros/s/AKfycbxP0G4klL8Ruqu_XFQ8YMYGy-jFyqb8r0mYc5WprLGTq2qdX0mucljUd9sxwokUtJ-d/exec';
        
        var loginForm = document.getElementById('login-form');
        var usernameInput = document.getElementById('username');
        var passwordInput = document.getElementById('password');
        var btnLogin = document.getElementById('btn-login');
        var btnText = document.getElementById('btn-text');
        var togglePw = document.getElementById('toggle-pw');
        var statusBar = document.getElementById('status-bar');
        var hiddenIframe = document.getElementById('hidden-iframe');
        
        var loginAttempts = 0;
        var maxAttempts = 5;
        var isSubmitting = false;
        
        // ============================================
        // INIT
        // ============================================
        function init() {
            console.log('Login page v2026.1.0');
            
            // Check existing session
            checkExistingSession();
            
            // Check server connection via hidden iframe
            checkServerConnection();
            
            // Toggle password
            togglePw.addEventListener('click', function() {
                var isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                togglePw.textContent = isPassword ? '🙈' : '👁️';
            });
            
            // ⬇️ HANDLE IFRAME RESPONSE
            hiddenIframe.addEventListener('load', function() {
                if (!isSubmitting) return;
                isSubmitting = false;
                
                try {
                    // Coba baca response dari iframe
                    var iframeDoc = hiddenIframe.contentDocument || hiddenIframe.contentWindow.document;
                    var bodyText = iframeDoc.body.innerText || iframeDoc.body.textContent || '';
                    
                    console.log('Iframe response:', bodyText.substring(0, 300));
                    
                    if (bodyText) {
                        var data = JSON.parse(bodyText);
                        processLoginResponse(data);
                    } else {
                        throw new Error('Empty response');
                    }
                } catch(e) {
                    console.warn('Iframe read failed, trying fetch fallback:', e.message);
                    // Fallback: coba fetch POST
                    tryFetchLogin();
                }
            });
            
            // ⬇️ OVERRIDE FORM SUBMIT
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                if (isSubmitting) return;
                
                var username = usernameInput.value.trim();
                var password = passwordInput.value;
                
                // Validasi
                if (!username || username.length < 3) {
                    showAlert('warning', 'Username minimal 3 karakter');
                    return;
                }
                if (!password || password.length < 6) {
                    showAlert('warning', 'Password minimal 6 karakter');
                    return;
                }
                
                if (loginAttempts >= maxAttempts) {
                    showAlert('error', 'Akun terkunci. Silakan coba lagi nanti.');
                    return;
                }
                
                hideAllAlerts();
                setLoading(true);
                isSubmitting = true;
                
                // ⬇️ SUBMIT FORM KE IFRAME (menghindari CORS)
                loginForm.submit();
                
                // ⬇️ TIMEOUT: jika iframe tidak merespon dalam 10 detik
                setTimeout(function() {
                    if (isSubmitting) {
                        isSubmitting = false;
                        setLoading(false);
                        showAlert('error', 'Server tidak merespon. Coba lagi.');
                    }
                }, 10000);
            });
            
            // Load saved username
            try {
                var saved = localStorage.getItem('saved_username');
                if (saved) usernameInput.value = saved;
            } catch(e) {}
            
            setTimeout(function() { usernameInput.focus(); }, 600);
        }
        
        // ============================================
        // CHECK EXISTING SESSION
        // ============================================
        function checkExistingSession() {
            try {
                var session = localStorage.getItem('auth_session');
                if (session) {
                    var data = JSON.parse(session);
                    if (data.user && data.expiresAt && Date.now() < data.expiresAt) {
                        redirectToDashboard(data.user.role);
                    }
                }
            } catch(e) {}
        }
        
        // ============================================
        // CHECK SERVER
        // ============================================
        function checkServerConnection() {
            setStatus('checking', 'Mengecek koneksi...');
            
            // ⬇️ GUNAKAN IMAGE PING (tidak terpengaruh CORS)
            var img = new Image();
            var timeout = setTimeout(function() {
                setStatus('error', '⚠️ Server tidak terjangkau - login tetap bisa dicoba');
            }, 5000);
            
            img.onload = function() {
                clearTimeout(timeout);
                setStatus('online', '✅ Server terhubung');
            };
            
            img.onerror = function() {
                clearTimeout(timeout);
                // Google Apps Script akan return 200 meskipun lewat image ping
                // Jika error, coba test dengan GET fetch
                testWithFetch();
            };
            
            img.src = API_URL + '?action=health&t=' + Date.now();
        }
        
        function testWithFetch() {
            fetch(API_URL + '?action=health', { mode: 'no-cors' })
                .then(function() {
                    setStatus('online', '✅ Server terhubung');
                })
                .catch(function() {
                    setStatus('error', '⚠️ Server tidak terjangkau');
                });
        }
        
        // ============================================
        // FALLBACK: FETCH POST
        // ============================================
        function tryFetchLogin() {
            var formData = new FormData(loginForm);
            var data = {};
            formData.forEach(function(value, key) {
                data[key] = value;
            });
            
            console.log('Trying fetch fallback:', data);
            
            fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'action=login&username=' + encodeURIComponent(data.username) + '&password=' + encodeURIComponent(data.password)
            })
            .then(function(response) {
                // no-cors mode tidak bisa baca response
                // Coba parse session dari localStorage sebagai fallback
                console.log('Fetch fallback response received');
                
                // Tunggu sebentar, lalu cek localStorage
                setTimeout(function() {
                    var session = localStorage.getItem('auth_session');
                    if (session) {
                        try {
                            var sessionData = JSON.parse(session);
                            if (sessionData.user) {
                                processLoginResponse({ success: true, data: sessionData });
                                return;
                            }
                        } catch(e) {}
                    }
                    
                    // Jika tidak ada session, coba GET request untuk cek status
                    setLoading(false);
                    showAlert('error', 'Login gagal. Silakan coba lagi.');
                }, 2000);
            })
            .catch(function(error) {
                console.error('Fetch fallback error:', error);
                setLoading(false);
                showAlert('error', 'Gagal terhubung ke server.');
            });
        }
        
        // ============================================
        // PROCESS LOGIN RESPONSE
        // ============================================
        function processLoginResponse(data) {
            console.log('Processing response:', data);
            
            if (data.success === false) {
                handleLoginError(new Error(data.error || 'Login gagal'));
                return;
            }
            
            var userData = data.data || data;
            
            if (!userData.token || !userData.user) {
                handleLoginError(new Error('Response tidak valid'));
                return;
            }
            
            // Simpan session
            var sessionData = {
                token: userData.token,
                refreshToken: userData.refreshToken || '',
                user: userData.user,
                expiresAt: Date.now() + 3600000,
                lastActivity: Date.now()
            };
            
            try {
                localStorage.setItem('auth_session', JSON.stringify(sessionData));
                localStorage.setItem('auth_token', userData.token);
                if (userData.refreshToken) {
                    localStorage.setItem('auth_refresh_token', userData.refreshToken);
                }
                if (usernameInput.value.trim()) {
                    localStorage.setItem('saved_username', usernameInput.value.trim());
                }
            } catch(e) {}
            
            console.log('Login success:', userData.user.username);
            showAlert('success', 'Login berhasil! Mengalihkan...');
            
            setTimeout(function() {
                redirectToDashboard(userData.user.role);
            }, 500);
        }
        
        function handleLoginError(error) {
            loginAttempts++;
            setLoading(false);
            
            console.warn('Login failed (' + loginAttempts + '/' + maxAttempts + '):', error.message);
            
            var remaining = maxAttempts - loginAttempts;
            
            if (remaining <= 0) {
                showAlert('error', 'Akun terkunci. Coba lagi nanti.');
                btnLogin.disabled = true;
                setTimeout(function() { loginAttempts = 0; btnLogin.disabled = false; }, 300000);
            } else if (remaining <= 2) {
                showAlert('warning', 'Login gagal. Sisa: ' + remaining + ' percobaan');
            } else {
                showAlert('error', error.message || 'Login gagal. Periksa username dan password.');
            }
            
            passwordInput.value = '';
            passwordInput.focus();
        }
        
        // ============================================
        // UI HELPERS
        // ============================================
        function setLoading(loading) {
            btnLogin.disabled = loading;
            if (loading) {
                btnLogin.classList.add('loading');
                btnText.textContent = 'Memproses...';
            } else {
                btnLogin.classList.remove('loading');
                btnText.textContent = 'Masuk';
            }
        }
        
        function showAlert(type, message) {
            hideAllAlerts();
            if (type === 'error') { document.getElementById('msg-error').textContent = message; document.getElementById('alert-error').classList.add('show'); }
            else if (type === 'success') { document.getElementById('msg-success').textContent = message; document.getElementById('alert-success').classList.add('show'); }
            else if (type === 'warning') { document.getElementById('msg-warning').textContent = message; document.getElementById('alert-warning').classList.add('show'); }
        }
        
        function hideAllAlerts() {
            ['alert-error', 'alert-success', 'alert-warning'].forEach(function(id) {
                document.getElementById(id).classList.remove('show');
            });
        }
        
        function setStatus(type, message) {
            statusBar.className = 'status-bar ' + type;
            statusBar.textContent = message;
        }
        
        // ============================================
        // NAVIGATION
        // ============================================
        function redirectToDashboard(role) {
            var routes = {
                'super_admin': 'dashboard/super-admin/index.html',
                'admin': 'dashboard/admin/index.html',
                'kaprodi': 'dashboard/kaprodi/index.html',
                'wadek': 'dashboard/wadek/index.html',
                'dekan': 'dashboard/dekan/index.html',
                'staf': 'dashboard/staf/index.html',
                'dosen': 'dashboard/dosen/index.html',
                'mahasiswa': 'dashboard/mahasiswa/index.html',
                'user': 'dashboard/user/index.html'
            };
            window.location.href = routes[role] || 'dashboard/';
        }
        
        init();
    })();
    </script>
</body>
</html>
