<!-- login.html - Login Page 2026 (FIXED) -->
<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="Login ke Sistem E-Arsip Digital">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- CSP - Fixed: tambah cdn.jsdelivr.net & script.google.com -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://cdn.jsdelivr.net https://script.google.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://script.google.com https://script.googleusercontent.com; form-action 'self'; base-uri 'self';">
    <meta name="csrf-token" id="csrf-token" content="">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <title>Login - E-Arsip Digital</title>
    
    <!-- Stylesheets - path relatif -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    
    <!-- Favicon inline -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50' y='68' text-anchor='middle' fill='white' font-size='55' font-weight='bold' font-family='Arial'>A</text></svg>">
    
    <style>
        /* ============================================ */
        /* CRITICAL CSS - LOGIN PAGE                     */
        /* ============================================ */
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --error: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --text: #1e293b;
            --text-light: #64748b;
            --bg: #ffffff;
            --bg-light: #f8fafc;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.15);
            --radius: 14px;
            --radius-sm: 10px;
            --transition: all 0.3s ease;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        
        .login-container {
            width: 100%;
            max-width: 440px;
            animation: fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .login-card {
            background: var(--bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 40px;
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), #764ba2);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-logo {
            width: 72px; height: 72px;
            margin: 0 auto 14px;
            background: linear-gradient(135deg, var(--primary), #764ba2);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }
        .login-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
        }
        .login-subtitle {
            font-size: 13px;
            color: var(--text-light);
            line-height: 1.5;
        }
        
        /* Form */
        .form-group {
            margin-bottom: 18px;
            position: relative;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }
        .input-wrapper { position: relative; }
        
        .form-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            font-size: 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-light);
            color: var(--text);
            transition: var(--transition);
            outline: none;
            font-family: inherit;
        }
        .form-input:focus {
            border-color: var(--primary);
            background: var(--bg);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .form-input.error {
            border-color: var(--error);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }
        .form-input.success {
            border-color: var(--success);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }
        
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 15px;
            pointer-events: none;
            transition: var(--transition);
        }
        .form-input:focus ~ .input-icon { color: var(--primary); }
        
        .password-toggle {
            position: absolute;
            right: 10px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none;
            color: var(--text-light);
            cursor: pointer; padding: 6px;
            transition: var(--transition);
        }
        .password-toggle:hover { color: var(--primary); }
        
        .error-message {
            font-size: 12px; color: var(--error);
            margin-top: 5px; display: none;
        }
        .error-message.show { display: block; animation: shake 0.3s ease; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .form-options {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 22px; font-size: 13px;
        }
        .remember-me {
            display: flex; align-items: center; gap: 8px;
            cursor: pointer; color: var(--text-light);
        }
        .remember-me input[type="checkbox"] {
            width: 16px; height: 16px;
            accent-color: var(--primary); cursor: pointer;
        }
        .forgot-password {
            color: var(--primary); text-decoration: none; font-weight: 500;
            transition: var(--transition);
        }
        .forgot-password:hover { color: var(--primary-hover); text-decoration: underline; }
        
        /* Button */
        .login-button {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white; border: none;
            border-radius: var(--radius-sm);
            font-size: 15px; font-weight: 600;
            cursor: pointer; transition: var(--transition);
            position: relative; overflow: hidden; font-family: inherit;
        }
        .login-button:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); }
        .login-button:active { transform: translateY(0); }
        .login-button:disabled {
            background: var(--text-light); cursor: not-allowed;
            transform: none; box-shadow: none;
        }
        .login-button .btn-spinner {
            display: none; width: 20px; height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%;
            animation: spin 0.6s linear infinite;
            position: absolute; right: 20px; top: 50%;
            transform: translateY(-50%);
        }
        .login-button.loading .btn-spinner { display: block; }
        .login-button.loading .button-text { opacity: 0.5; }
        @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }
        
        /* Alerts */
        .alert {
            padding: 12px 14px; border-radius: var(--radius-sm);
            margin-bottom: 18px; font-size: 13px; display: none;
            animation: slideDown 0.3s ease;
        }
        .alert.show { display: flex; align-items: center; gap: 8px; }
        .alert-error { background: #fef2f2; color: var(--error); border: 1px solid #fecaca; }
        .alert-success { background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; }
        .alert-warning { background: #fffbeb; color: var(--warning); border: 1px solid #fde68a; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .footer-text {
            text-align: center; margin-top: 22px;
            font-size: 12px; color: var(--text-light);
        }
        .footer-text a { color: var(--primary); text-decoration: none; font-weight: 500; }
        .footer-text a:hover { text-decoration: underline; }
        
        /* Loading overlay */
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3); display: none;
            justify-content: center; align-items: center; z-index: 9999;
        }
        .loading-overlay.show { display: flex; }
        .loading-spinner {
            width: 50px; height: 50px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @media (max-width: 480px) {
            .login-card { padding: 28px 20px; }
            .login-title { font-size: 20px; }
            .form-options { flex-direction: column; gap: 10px; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner"></div>
    </div>
    
    <!-- Login Container -->
    <div class="login-container">
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <div class="login-logo">📁</div>
                <h1 class="login-title">E-Arsip Digital</h1>
                <p class="login-subtitle">Masuk ke sistem manajemen arsip digital</p>
            </div>
            
            <!-- Alert Messages -->
            <div class="alert alert-error" id="alert-error" role="alert">
                <i class="fas fa-exclamation-circle"></i>
                <span id="alert-error-message"></span>
            </div>
            <div class="alert alert-success" id="alert-success" role="alert">
                <i class="fas fa-check-circle"></i>
                <span id="alert-success-message"></span>
            </div>
            <div class="alert alert-warning" id="alert-warning" role="alert">
                <i class="fas fa-exclamation-triangle"></i>
                <span id="alert-warning-message"></span>
            </div>
            
            <!-- Login Form -->
            <form id="login-form" novalidate>
                <!-- Username -->
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="username" class="form-input" 
                            placeholder="Masukkan username" autocomplete="username" required autofocus>
                    </div>
                    <div class="error-message" id="username-error"></div>
                </div>
                
                <!-- Password -->
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" class="form-input" 
                            placeholder="Masukkan password" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" id="password-toggle" aria-label="Toggle password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="error-message" id="password-error"></div>
                </div>
                
                <!-- Options -->
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember-me">
                        <span>Ingat saya</span>
                    </label>
                    <a href="#" class="forgot-password" id="forgot-password-link">Lupa password?</a>
                </div>
                
                <!-- Login Button -->
                <button type="submit" class="login-button" id="login-button">
                    <span class="button-text">Masuk</span>
                    <span class="btn-spinner"></span>
                </button>
            </form>
            
            <!-- Footer -->
            <div class="footer-text">
                <p>Belum punya akun? <a href="#">Hubungi Administrator</a></p>
                <p style="margin-top: 2px; font-size: 11px;">v2026.1.0</p>
            </div>
        </div>
    </div>
    
    <!-- ============================================ -->
    <!-- SCRIPT - NO ES MODULE IMPORTS (FIXED)        -->
    <!-- ============================================ -->
    <script>
    (function() {
        'use strict';
        
        // ============================================
        // DOM ELEMENTS
        // ============================================
        var loginForm = document.getElementById('login-form');
        var usernameInput = document.getElementById('username');
        var passwordInput = document.getElementById('password');
        var loginButton = document.getElementById('login-button');
        var passwordToggle = document.getElementById('password-toggle');
        var alertError = document.getElementById('alert-error');
        var alertSuccess = document.getElementById('alert-success');
        var alertWarning = document.getElementById('alert-warning');
        var alertErrorMessage = document.getElementById('alert-error-message');
        var alertSuccessMessage = document.getElementById('alert-success-message');
        var alertWarningMessage = document.getElementById('alert-warning-message');
        var loadingOverlay = document.getElementById('loading-overlay');
        
        // State
        var loginAttempts = 0;
        var maxAttempts = 5;
        var lockoutTimer = null;
        
        // ============================================
        // CONFIG - Sync dengan Google Apps Script
        // ============================================
        var API_URL = 'https://script.google.com/macros/s/AKfycbxP0G4klL8Ruqu_XFQ8YMYGy-jFyqb8r0mYc5WprLGTq2qdX0mucljUd9sxwokUtJ-d/exec';
        
        // ============================================
        // INIT
        // ============================================
        function init() {
            // Check if already logged in
            if (localStorage.getItem('auth_session')) {
                try {
                    var session = JSON.parse(localStorage.getItem('auth_session'));
                    if (session && session.user && session.expiresAt && Date.now() < session.expiresAt) {
                        redirectToDashboard(session.user.role);
                        return;
                    }
                } catch(e) {}
            }
            
            // Load saved username
            var saved = localStorage.getItem('saved_username');
            if (saved) {
                usernameInput.value = saved;
                document.getElementById('remember-me').checked = true;
            }
            
            // Check URL params
            checkSessionMessage();
            
            // Event listeners
            setupEvents();
            
            // Focus
            setTimeout(function() { usernameInput.focus(); }, 300);
            
            console.log('Login page initialized - v2026.1.0');
        }
        
        // ============================================
        // EVENT LISTENERS
        // ============================================
        function setupEvents() {
            loginForm.addEventListener('submit', handleLogin);
            passwordToggle.addEventListener('click', togglePassword);
            document.getElementById('forgot-password-link').addEventListener('click', handleForgotPassword);
            
            // Clear errors on input
            usernameInput.addEventListener('input', function() {
                hideAlert('error');
                usernameInput.classList.remove('error');
                document.getElementById('username-error').classList.remove('show');
            });
            
            passwordInput.addEventListener('input', function() {
                hideAlert('error');
                passwordInput.classList.remove('error');
                document.getElementById('password-error').classList.remove('show');
            });
        }
        
        // ============================================
        // LOGIN HANDLER - Google Apps Script
        // ============================================
        async function handleLogin(event) {
            event.preventDefault();
            
            // Validate
            if (!validateForm()) return;
            
            // Check lockout
            if (loginAttempts >= maxAttempts) {
                showAlert('error', 'Terlalu banyak percobaan. Silakan coba lagi nanti.');
                return;
            }
            
            // Show loading
            setLoading(true);
            
            try {
                var username = usernameInput.value.trim();
                var password = passwordInput.value;
                
                // ⬇️ PANGGIL GOOGLE APPS SCRIPT - Action: login
                var response = await fetch(API_URL + '?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        timestamp: Date.now()
                    })
                });
                
                var result = await response.json();
                
                // ⬇️ Google Apps Script returns { success: true, data: { token, user } }
                if (result.success && result.data) {
                    handleLoginSuccess(result.data, username);
                } else {
                    throw new Error(result.error || 'Login gagal');
                }
                
            } catch (error) {
                handleLoginError(error);
            } finally {
                setLoading(false);
            }
        }
        
        function handleLoginSuccess(data, username) {
            loginAttempts = 0;
            
            // Save session
            var sessionData = {
                token: data.token,
                refreshToken: data.refreshToken,
                user: data.user,
                expiresAt: Date.now() + 3600000, // 1 jam
                lastActivity: Date.now()
            };
            
            localStorage.setItem('auth_session', JSON.stringify(sessionData));
            localStorage.setItem('auth_token', data.token);
            if (data.refreshToken) {
                localStorage.setItem('auth_refresh_token', data.refreshToken);
            }
            
            // Remember me
            if (document.getElementById('remember-me').checked) {
                localStorage.setItem('saved_username', username);
            }
            
            showAlert('success', 'Login berhasil! Mengalihkan...');
            
            setTimeout(function() {
                redirectToDashboard(data.user.role);
            }, 800);
        }
        
        function handleLoginError(error) {
            loginAttempts++;
            var remaining = maxAttempts - loginAttempts;
            
            if (remaining <= 0) {
                showAlert('error', 'Akun terkunci. Silakan coba lagi dalam 15 menit.');
                loginButton.disabled = true;
                lockoutTimer = setTimeout(function() {
                    loginAttempts = 0;
                    loginButton.disabled = false;
                    hideAlert('error');
                }, 900000);
            } else if (remaining <= 2) {
                showAlert('warning', 'Login gagal. Percobaan tersisa: ' + remaining);
            } else {
                showAlert('error', error.message || 'Username atau password salah');
            }
            
            passwordInput.value = '';
            passwordInput.focus();
        }
        
        // ============================================
        // VALIDATION
        // ============================================
        function validateForm() {
            var valid = true;
            var username = usernameInput.value.trim();
            var password = passwordInput.value;
            
            if (!username) {
                showFieldError(usernameInput, 'username-error', 'Username wajib diisi');
                valid = false;
            } else if (username.length < 3) {
                showFieldError(usernameInput, 'username-error', 'Username minimal 3 karakter');
                valid = false;
            } else {
                clearFieldError(usernameInput, 'username-error');
            }
            
            if (!password) {
                showFieldError(passwordInput, 'password-error', 'Password wajib diisi');
                valid = false;
            } else if (password.length < 6) {
                showFieldError(passwordInput, 'password-error', 'Password minimal 6 karakter');
                valid = false;
            } else {
                clearFieldError(passwordInput, 'password-error');
            }
            
            return valid;
        }
        
        function showFieldError(input, errorId, message) {
            input.classList.add('error');
            var errorEl = document.getElementById(errorId);
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }
        
        function clearFieldError(input, errorId) {
            input.classList.remove('error');
            input.classList.add('success');
            var errorEl = document.getElementById(errorId);
            errorEl.classList.remove('show');
        }
        
        // ============================================
        // UI HELPERS
        // ============================================
        function setLoading(loading) {
            loginButton.disabled = loading;
            if (loading) {
                loginButton.classList.add('loading');
                loadingOverlay.classList.add('show');
            } else {
                loginButton.classList.remove('loading');
                loadingOverlay.classList.remove('show');
            }
        }
        
        function showAlert(type, message) {
            [alertError, alertSuccess, alertWarning].forEach(function(a) {
                a.classList.remove('show');
            });
            
            if (type === 'error') {
                alertErrorMessage.textContent = message;
                alertError.classList.add('show');
            } else if (type === 'success') {
                alertSuccessMessage.textContent = message;
                alertSuccess.classList.add('show');
            } else if (type === 'warning') {
                alertWarningMessage.textContent = message;
                alertWarning.classList.add('show');
            }
        }
        
        function hideAlert(type) {
            if (type === 'error') alertError.classList.remove('show');
            if (type === 'success') alertSuccess.classList.remove('show');
            if (type === 'warning') alertWarning.classList.remove('show');
        }
        
        function togglePassword() {
            var type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            var icon = passwordToggle.querySelector('i');
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        }
        
        // ============================================
        // NAVIGATION
        // ============================================
        function redirectToDashboard(role) {
            var routes = {
                'super_admin': 'dashboard/super-admin/index.html',
                'admin': 'dashboard/admin/index.html',
                'kaprodi': 'dashboard/kaprodi/index.html',
                'wadek': 'dashboard/wadek/index.html',
                'dekan': 'dashboard/dekan/index.html',
                'staf': 'dashboard/staf/index.html',
                'dosen': 'dashboard/dosen/index.html',
                'mahasiswa': 'dashboard/mahasiswa/index.html',
                'user': 'dashboard/user/index.html'
            };
            
            window.location.href = routes[role] || 'dashboard/';
        }
        
        function handleForgotPassword(event) {
            event.preventDefault();
            var username = usernameInput.value.trim();
            
            if (!username) {
                showAlert('warning', 'Masukkan username terlebih dahulu');
                usernameInput.focus();
                return;
            }
            
            if (confirm('Reset password untuk user: ' + username + '?')) {
                fetch(API_URL + '?action=resetPassword', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username })
                })
                .then(function(r) { return r.json(); })
                .then(function(res) {
                    if (res.success) {
                        showAlert('success', 'Password baru: ' + (res.data?.newPassword || 'terkirim ke email'));
                    } else {
                        showAlert('error', res.error || 'Gagal reset password');
                    }
                })
                .catch(function() {
                    showAlert('error', 'Gagal menghubungi server');
                });
            }
        }
        
        function checkSessionMessage() {
            var params = new URLSearchParams(window.location.search);
            var msg = params.get('message');
            
            if (msg === 'session_expired') {
                showAlert('warning', 'Sesi berakhir. Silakan login kembali.');
            } else if (msg === 'logged_out') {
                showAlert('success', 'Anda telah logout.');
            }
        }
        
        // ============================================
        // SERVICE WORKER
        // ============================================
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(function() {});
        }
        
        // ============================================
        // START
        // ============================================
        init();
        
    })();
    </script>
</body>
</html>
