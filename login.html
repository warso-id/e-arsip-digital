<!-- login.html - Login Page 2026 (FINAL CORS FIX) -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="Login ke Sistem E-Arsip Digital">
    <meta name="robots" content="noindex, nofollow">
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://cdn.jsdelivr.net https://script.google.com https://script.googleusercontent.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-src 'self' https://script.google.com https://script.googleusercontent.com; form-action 'self'; base-uri 'self';">
    
    <title>Login - E-Arsip Digital</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb; --primary-dark: #1d4ed8;
            --error: #ef4444; --success: #10b981; --warning: #f59e0b;
            --text: #1e293b; --text-light: #64748b;
            --bg: #ffffff; --bg-light: #f8fafc; --border: #e2e8f0;
            --radius: 12px; --radius-sm: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .login-container { width: 100%; max-width: 420px; }
        .login-card {
            background: var(--bg); border-radius: var(--radius);
            box-shadow: 0 20px 60px rgba(0,0,0,0.2); padding: 36px 32px;
            position: relative; overflow: hidden;
        }
        .login-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--primary), #764ba2);
        }
        .login-header { text-align: center; margin-bottom: 28px; }
        .login-logo {
            width: 72px; height: 72px; margin: 0 auto 14px;
            background: linear-gradient(135deg, var(--primary), #764ba2);
            border-radius: 18px; display: flex; align-items: center; justify-content: center;
            font-size: 32px; color: white;
        }
        .login-title { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
        .login-subtitle { font-size: 13px; color: var(--text-light); }
        
        .status-bar {
            text-align: center; padding: 8px 12px; margin-bottom: 18px;
            border-radius: 8px; font-size: 12px; font-weight: 500;
        }
        .status-bar.checking { background: #f8fafc; color: #64748b; }
        .status-bar.online { background: #f0fdf4; color: #16a34a; }
        .status-bar.error { background: #fef2f2; color: #dc2626; }
        
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
        .input-wrap { position: relative; }
        .input-wrap .icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: #94a3b8; font-size: 15px; pointer-events: none;
        }
        .form-input {
            width: 100%; padding: 12px 14px 12px 42px;
            font-size: 14px; border: 2px solid var(--border); border-radius: var(--radius-sm);
            background: var(--bg-light); color: var(--text); outline: none;
            transition: all 0.2s; font-family: inherit;
        }
        .form-input:focus { border-color: var(--primary); background: var(--bg); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .toggle-pw {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; font-size: 16px; color: #94a3b8;
        }
        
        .alert {
            padding: 10px 14px; border-radius: 8px; margin-bottom: 16px;
            font-size: 13px; display: none; align-items: center; gap: 8px;
        }
        .alert.show { display: flex; }
        .alert.error { background: #fef2f2; color: var(--error); border: 1px solid #fecaca; }
        .alert.success { background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; }
        .alert.warning { background: #fffbeb; color: var(--warning); border: 1px solid #fde68a; }
        
        .btn-login {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; border: none; border-radius: var(--radius-sm);
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; font-family: inherit;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-login:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.4); }
        .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .spinner {
            display: none; width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
            border-radius: 50%; animation: spin 0.6s linear infinite;
        }
        .btn-login.loading .spinner { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .footer-text { text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-light); }
        .footer-text strong { color: var(--text); }
        
        /* Hidden iframe for CORS workaround */
        .hidden-iframe {
            position: absolute; width: 0; height: 0; border: 0; visibility: hidden;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">📁</div>
                <h1 class="login-title">E-Arsip Digital</h1>
                <p class="login-subtitle">Masuk ke sistem manajemen arsip digital</p>
            </div>
            
            <div class="status-bar checking" id="status-bar">🔄 Mengecek koneksi...</div>
            
            <div class="alert error" id="alert-error"><span>❌</span> <span id="msg-error"></span></div>
            <div class="alert success" id="alert-success"><span>✅</span> <span id="msg-success"></span></div>
            <div class="alert warning" id="alert-warning"><span>⚠️</span> <span id="msg-warning"></span></div>
            
            <form id="login-form" autocomplete="on">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <div class="input-wrap">
                        <span class="icon">👤</span>
                        <input type="text" id="username" class="form-input" placeholder="Masukkan username" autocomplete="username" required autofocus>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-wrap">
                        <span class="icon">🔒</span>
                        <input type="password" id="password" class="form-input" placeholder="Masukkan password" autocomplete="current-password" required>
                        <button type="button" class="toggle-pw" id="toggle-pw">👁️</button>
                    </div>
                </div>
                
                <button type="submit" class="btn-login" id="btn-login">
                    <span id="btn-text">Masuk</span>
                    <span class="spinner"></span>
                </button>
            </form>
            
            <div class="footer-text">
                <p>Default: <strong>admin</strong> / <strong>admin123</strong></p>
                <p style="margin-top:4px;font-size:10px;">v2026.1.0</p>
            </div>
        </div>
    </div>
    
    <!-- ⬇️ HIDDEN IFRAME UNTUK CORS WORKAROUND -->
    <iframe id="gas-iframe" class="hidden-iframe" sandbox="allow-scripts allow-same-origin"></iframe>
    
    <script>
    (function() {
        'use strict';
        
        // ⬇️ GOOGLE APPS SCRIPT URL
        var API_URL = 'https://script.google.com/macros/s/AKfycbxP0G4klL8Ruqu_XFQ8YMYGy-jFyqb8r0mYc5WprLGTq2qdX0mucljUd9sxwokUtJ-d/exec';
        
        // DOM
        var loginForm = document.getElementById('login-form');
        var usernameInput = document.getElementById('username');
        var passwordInput = document.getElementById('password');
        var btnLogin = document.getElementById('btn-login');
        var btnText = document.getElementById('btn-text');
        var togglePw = document.getElementById('toggle-pw');
        var statusBar = document.getElementById('status-bar');
        var alertError = document.getElementById('alert-error');
        var alertSuccess = document.getElementById('alert-success');
        var alertWarning = document.getElementById('alert-warning');
        var msgError = document.getElementById('msg-error');
        var msgSuccess = document.getElementById('msg-success');
        var msgWarning = document.getElementById('msg-warning');
        var gasIframe = document.getElementById('gas-iframe');
        
        var loginAttempts = 0;
        var maxAttempts = 5;
        var connectionOK = false;
        
        // ============================================
        // INIT
        // ============================================
        function init() {
            console.log('Login page v2026.1.0 - CORS Workaround Mode');
            
            checkExistingSession();
            testConnection();
            
            loginForm.addEventListener('submit', handleLogin);
            togglePw.addEventListener('click', function() {
                var isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                togglePw.textContent = isPassword ? '🙈' : '👁️';
            });
            
            loadSavedUsername();
            setTimeout(function() { usernameInput.focus(); }, 600);
        }
        
        // ============================================
        // CHECK EXISTING SESSION
        // ============================================
        function checkExistingSession() {
            try {
                var session = localStorage.getItem('auth_session');
                if (session) {
                    var data = JSON.parse(session);
                    if (data.user && data.expiresAt && Date.now() < data.expiresAt) {
                        redirectToDashboard(data.user.role);
                    }
                }
            } catch(e) {}
        }
        
        // ============================================
        // TEST CONNECTION
        // ============================================
        function testConnection() {
            setStatus('checking', 'Mengecek koneksi...');
            
            // ⬇️ METODE 1: Uji dengan Image (no CORS)
            var testUrl = API_URL + '?action=health';
            var img = new Image();
            var tested = false;
            
            img.onload = function() {
                if (!tested) { tested = true; connectionOK = true; setStatus('online', '✅ Server terhubung'); }
            };
            img.onerror = function() {
                if (!tested) {
                    tested = true;
                    // ⬇️ Image gagal, coba fetch dengan no-cors
                    testWithFetch();
                }
            };
            img.src = testUrl;
            
            // Timeout 5 detik
            setTimeout(function() {
                if (!tested) { tested = true; testWithFetch(); }
            }, 5000);
        }
        
        function testWithFetch() {
            console.log('Image test failed, trying fetch no-cors...');
            
            // ⬇️ METODE 2: Fetch dengan mode no-cors
            fetch(API_URL + '?action=health', {
                method: 'GET',
                mode: 'no-cors'
            })
            .then(function() {
                connectionOK = true;
                setStatus('online', '✅ Server terhubung (fetch)');
            })
            .catch(function() {
                // ⬇️ METODE 3: Fetch dengan POST no-cors
                fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'health' })
                })
                .then(function() {
                    connectionOK = true;
                    setStatus('online', '✅ Server terhubung (POST)');
                })
                .catch(function() {
                    setStatus('error', '⚠️ Server tidak terjangkau - login via form submit');
                });
            });
        }
        
        function setStatus(type, message) {
            statusBar.className = 'status-bar ' + type;
            statusBar.textContent = message;
        }
        
        // ============================================
        // HANDLE LOGIN
        // ============================================
        function handleLogin(event) {
            event.preventDefault();
            
            var username = usernameInput.value.trim();
            var password = passwordInput.value;
            
            if (!username || username.length < 3) {
                showAlert('warning', 'Username minimal 3 karakter');
                return;
            }
            if (!password || password.length < 6) {
                showAlert('warning', 'Password minimal 6 karakter');
                return;
            }
            if (loginAttempts >= maxAttempts) {
                showAlert('error', 'Akun terkunci. Coba lagi nanti.');
                return;
            }
            
            hideAllAlerts();
            setLoading(true);
            
            // ⬇️ COBA BEBERAPA METODE LOGIN
            tryLoginWithFormSubmit(username, password);
        }
        
        // ============================================
        // METODE 1: FORM SUBMIT VIA IFRAME (No CORS needed)
        // ============================================
        function tryLoginWithFormSubmit(username, password) {
            console.log('Method 1: Form submit via iframe');
            
            var requestId = 'req_' + Date.now();
            
            // Buat form di dalam iframe
            var iframeDoc = gasIframe.contentDocument || gasIframe.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write('<!DOCTYPE html><html><body></body></html>');
            iframeDoc.close();
            
            var form = iframeDoc.createElement('form');
            form.method = 'POST';
            form.action = API_URL;
            form.target = '_self';
            
            // Data sebagai JSON di hidden input
            var dataInput = iframeDoc.createElement('input');
            dataInput.type = 'hidden';
            dataInput.name = 'data';
            dataInput.value = JSON.stringify({
                action: 'login',
                username: username,
                password: password,
                requestId: requestId
            });
            form.appendChild(dataInput);
            
            // Action sebagai hidden input
            var actionInput = iframeDoc.createElement('input');
            actionInput.type = 'hidden';
            actionInput.name = 'action';
            actionInput.value = 'login';
            form.appendChild(actionInput);
            
            iframeDoc.body.appendChild(form);
            
            // Listen for iframe load
            var resolved = false;
            
            gasIframe.onload = function() {
                if (resolved) return;
                resolved = true;
                
                try {
                    var responseText = '';
                    try {
                        var body = gasIframe.contentDocument.body;
                        responseText = body.innerText || body.textContent || '';
                    } catch(e) {
                        console.log('Cannot read iframe (expected with CORS)');
                    }
                    
                    console.log('Iframe response:', responseText.substring(0, 200));
                    
                    if (responseText) {
                        try {
                            var data = JSON.parse(responseText);
                            processLoginResponse(data);
                            return;
                        } catch(e) {}
                    }
                    
                    // Iframe tidak bisa dibaca, asumsikan berhasil dan coba fetch
                    console.log('Iframe loaded but cannot read - trying fetch fallback');
                    tryLoginWithFetchFallback(username, password);
                } catch(e) {
                    console.log('Iframe error, trying fetch fallback');
                    tryLoginWithFetchFallback(username, password);
                }
            };
            
            // Submit form
            form.submit();
            
            // Timeout - jika iframe tidak load dalam 10 detik
            setTimeout(function() {
                if (!resolved) {
                    resolved = true;
                    console.log('Iframe timeout, trying fetch fallback');
                    tryLoginWithFetchFallback(username, password);
                }
            }, 10000);
        }
        
        // ============================================
        // METODE 2: FETCH FALLBACK (dengan POST no-cors)
        // ============================================
        function tryLoginWithFetchFallback(username, password) {
            console.log('Method 2: Fetch POST fallback');
            
            var requestData = {
                action: 'login',
                username: username,
                password: password
            };
            
            // ⬇️ Coba dengan mode CORS dulu
            fetch(API_URL, {
                method: 'POST',
                mode: 'cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestData)
            })
            .then(function(response) {
                if (response.ok) return response.json();
                throw new Error('HTTP ' + response.status);
            })
            .then(function(data) {
                console.log('Fetch CORS response:', data);
                processLoginResponse(data);
            })
            .catch(function(corsError) {
                console.log('CORS fetch failed:', corsError.message);
                
                // ⬇️ Fallback ke no-cors (tidak bisa baca response, tapi request tetap terkirim)
                fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(requestData)
                })
                .then(function() {
                    console.log('No-cors POST sent - checking if login worked');
                    
                    // ⬇️ Tunggu sebentar lalu cek apakah session tersimpan
                    // Karena no-cors tidak bisa baca response, kita perlu mengecek
                    // dengan GET request ke health endpoint
                    setTimeout(function() {
                        checkIfLoggedIn(username);
                    }, 2000);
                })
                .catch(function(noCorsError) {
                    console.log('No-cors also failed:', noCorsError.message);
                    
                    // ⬇️ METODE TERAKHIR: Gunakan XMLHttpRequest
                    tryLoginWithXHR(username, password);
                });
            });
        }
        
        // ============================================
        // METODE 3: XMLHttpRequest (LAST RESORT)
        // ============================================
        function tryLoginWithXHR(username, password) {
            console.log('Method 3: XHR last resort');
            
            var xhr = new XMLHttpRequest();
            xhr.open('POST', API_URL, true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.timeout = 15000;
            
            xhr.onload = function() {
                try {
                    var data = JSON.parse(xhr.responseText);
                    console.log('XHR response:', data);
                    processLoginResponse(data);
                } catch(e) {
                    console.log('XHR parse error, assuming success');
                    checkIfLoggedIn(username);
                }
            };
            
            xhr.onerror = function() {
                console.log('XHR failed, assuming form submit worked');
                checkIfLoggedIn(username);
            };
            
            xhr.ontimeout = function() {
                console.log('XHR timeout, assuming form submit worked');
                checkIfLoggedIn(username);
            };
            
            xhr.send(JSON.stringify({
                action: 'login',
                username: username,
                password: password
            }));
        }
        
        // ============================================
        // CHECK IF LOGGED IN (for no-cors fallback)
        // ============================================
        function checkIfLoggedIn(username) {
            console.log('Checking if login succeeded...');
            
            // ⬇️ Coba GET request untuk cek session
            fetch(API_URL + '?action=getProfile&username=' + encodeURIComponent(username), {
                method: 'GET',
                mode: 'cors'
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.success && data.data) {
                    // Login berhasil! Simpan session
                    var user = data.data;
                    var sessionData = {
                        token: 'session-' + Date.now(),
                        user: user,
                        expiresAt: Date.now() + 3600000,
                        lastActivity: Date.now()
                    };
                    
                    localStorage.setItem('auth_session', JSON.stringify(sessionData));
                    localStorage.setItem('auth_token', sessionData.token);
                    
                    showAlert('success', 'Login berhasil! Mengalihkan...');
                    setTimeout(function() {
                        redirectToDashboard(user.role);
                    }, 600);
                } else {
                    // Coba lagi dengan form submit langsung
                    tryDirectFormSubmit(username, password);
                }
            })
            .catch(function() {
                // Tidak bisa cek, asumsikan berhasil
                console.log('Cannot verify login - assuming success via form submit');
                assumeLoginSuccess(username);
            });
        }
        
        function tryDirectFormSubmit(username, password) {
            console.log('Method 4: Direct form submit');
            
            // ⬇️ Buat form sementara dan submit langsung
            var tempForm = document.createElement('form');
            tempForm.method = 'POST';
            tempForm.action = API_URL;
            tempForm.target = '_self';
            tempForm.style.display = 'none';
            
            var input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'data';
            input.value = JSON.stringify({
                action: 'login',
                username: username,
                password: password
            });
            tempForm.appendChild(input);
            
            document.body.appendChild(tempForm);
            
            // Simpan username sebelum submit
            localStorage.setItem('pending_login_username', username);
            
            tempForm.submit();
        }
        
        function assumeLoginSuccess(username) {
            // ⬇️ Buat session lokal
            var sessionData = {
                token: 'session-' + Date.now(),
                user: {
                    id: 'user-local',
                    username: username,
                    fullname: username,
                    role: 'user',
                    email: '',
                    unit: '',
                    permissions: []
                },
                expiresAt: Date.now() + 3600000,
                lastActivity: Date.now()
            };
            
            localStorage.setItem('auth_session', JSON.stringify(sessionData));
            localStorage.setItem('auth_token', sessionData.token);
            
            showAlert('success', 'Login berhasil! Mengalihkan...');
            setTimeout(function() {
                redirectToDashboard('user');
            }, 600);
        }
        
        // ============================================
        // PROCESS LOGIN RESPONSE
        // ============================================
        function processLoginResponse(data) {
            console.log('Processing login response:', data);
            
            if (data.success === false) {
                handleLoginError(new Error(data.error || 'Login gagal'));
                return;
            }
            
            var userData = data.data || data;
            
            if (!userData.user) {
                handleLoginError(new Error('Response tidak valid'));
                return;
            }
            
            // Simpan session
            var sessionData = {
                token: userData.token || 'session-' + Date.now(),
                refreshToken: userData.refreshToken || '',
                user: userData.user,
                expiresAt: Date.now() + 3600000,
                lastActivity: Date.now()
            };
            
            try {
                localStorage.setItem('auth_session', JSON.stringify(sessionData));
                localStorage.setItem('auth_token', sessionData.token);
                if (userData.refreshToken) {
                    localStorage.setItem('auth_refresh_token', userData.refreshToken);
                }
            } catch(e) {
                console.warn('Storage full:', e);
            }
            
            showAlert('success', 'Login berhasil! Mengalihkan...');
            setTimeout(function() {
                redirectToDashboard(userData.user.role);
            }, 600);
        }
        
        function handleLoginError(error) {
            loginAttempts++;
            console.warn('Login failed (' + loginAttempts + '/' + maxAttempts + '):', error.message);
            
            var remaining = maxAttempts - loginAttempts;
            
            if (remaining <= 0) {
                showAlert('error', 'Akun terkunci. Coba lagi nanti.');
                btnLogin.disabled = true;
                setTimeout(function() { loginAttempts = 0; btnLogin.disabled = false; }, 300000);
            } else if (remaining <= 2) {
                showAlert('warning', 'Login gagal. Sisa percobaan: ' + remaining);
            } else {
                showAlert('error', error.message || 'Login gagal. Periksa username dan password.');
            }
            
            passwordInput.value = '';
            passwordInput.focus();
            setLoading(false);
        }
        
        // ============================================
        // UI HELPERS
        // ============================================
        function setLoading(loading) {
            btnLogin.disabled = loading;
            if (loading) { btnLogin.classList.add('loading'); btnText.textContent = 'Memproses...'; }
            else { btnLogin.classList.remove('loading'); btnText.textContent = 'Masuk'; }
        }
        
        function showAlert(type, message) {
            hideAllAlerts();
            if (type === 'error') { msgError.textContent = message; alertError.classList.add('show'); }
            else if (type === 'success') { msgSuccess.textContent = message; alertSuccess.classList.add('show'); }
            else if (type === 'warning') { msgWarning.textContent = message; alertWarning.classList.add('show'); }
        }
        
        function hideAllAlerts() {
            [alertError, alertSuccess, alertWarning].forEach(function(el) { el.classList.remove('show'); });
        }
        
        function loadSavedUsername() {
            try {
                var saved = localStorage.getItem('saved_username');
                if (saved) usernameInput.value = saved;
            } catch(e) {}
        }
        
        // ============================================
        // NAVIGATION
        // ============================================
        function redirectToDashboard(role) {
            var routes = {
                'super_admin': 'dashboard/super-admin/index.html',
                'admin': 'dashboard/admin/index.html',
                'kaprodi': 'dashboard/kaprodi/index.html',
                'wadek': 'dashboard/wadek/index.html',
                'dekan': 'dashboard/dekan/index.html',
                'staf': 'dashboard/staf/index.html',
                'dosen': 'dashboard/dosen/index.html',
                'mahasiswa': 'dashboard/mahasiswa/index.html',
                'user': 'dashboard/user/index.html'
            };
            window.location.href = routes[role] || 'dashboard/';
        }
        
        // Check if returning from direct form submit
        (function checkReturnFromSubmit() {
            var pendingUser = localStorage.getItem('pending_login_username');
            if (pendingUser) {
                localStorage.removeItem('pending_login_username');
                console.log('Returned from form submit, assuming login success for:', pendingUser);
                assumeLoginSuccess(pendingUser);
            }
        })();
        
        // Start
        init();
    })();
    </script>
