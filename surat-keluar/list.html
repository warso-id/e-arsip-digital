    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb; --primary-dark: #1d4ed8;
            --success: #16a34a; --danger: #dc2626; --warning: #d97706; --info: #0891b2;
            --text: #1e293b; --text-light: #64748b;
            --bg: #f8fafc; --white: #ffffff; --border: #e2e8f0;
            --radius: 12px; --radius-sm: 8px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --transition: all 0.2s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Loading */
        .loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--white); display: flex; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.4s; }
        .loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .spinner { width: 44px; height: 44px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Sidebar */
        .sidebar { position: fixed; top: 0; left: 0; width: 250px; height: 100vh; background: linear-gradient(180deg, #1e293b, #0f172a); color: white; z-index: 100; overflow-y: auto; transition: transform 0.3s; }
        .sidebar-brand { padding: 20px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-brand i { color: #60a5fa; font-size: 22px; }
        .sidebar-nav { padding: 12px 0; }
        .sidebar-nav .nav-item { display: flex; align-items: center; gap: 10px; padding: 11px 20px; color: rgba(255,255,255,0.7); text-decoration: none; font-size: 13px; font-weight: 500; transition: var(--transition); border-left: 3px solid transparent; }
        .sidebar-nav .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .sidebar-nav .nav-item.active { background: rgba(37,99,235,0.2); color: white; border-left-color: #60a5fa; font-weight: 600; }
        .sidebar-nav .nav-item i { width: 18px; text-align: center; }
        .sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.1); margin-top: auto; }
        
        /* Main */
        .main-content { margin-left: 250px; min-height: 100vh; padding: 24px; transition: margin 0.3s; }
        
        /* Buttons */
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; font-size: 13px; font-weight: 600; border: none; border-radius: var(--radius-sm); cursor: pointer; text-decoration: none; transition: var(--transition); font-family: inherit; white-space: nowrap; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-success { background: var(--success); color: white; }
        .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
        .btn-outline:hover:not(:disabled) { background: var(--primary); color: white; }
        .btn-ghost { background: transparent; color: var(--text-light); border: none; }
        .btn-ghost:hover { color: var(--text); background: #f1f5f9; }
        .btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 6px; }
        .btn-icon { width: 34px; height: 34px; padding: 0; justify-content: center; border-radius: 8px; }
        .btn-action { width: 32px; height: 32px; border: none; background: transparent; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: var(--transition); color: var(--text-light); }
        .btn-action:hover { background: #f1f5f9; }
        
        /* Page Header */
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .page-header h2 { font-size: 22px; font-weight: 700; margin: 0; }
        
        /* Bulk Actions */
        .bulk-actions { display: none; padding: 10px 16px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: var(--radius-sm); margin-bottom: 16px; align-items: center; gap: 10px; flex-wrap: wrap; }
        .bulk-actions.visible { display: flex; }
        .bulk-actions .bulk-count { font-size: 13px; font-weight: 600; color: var(--primary); margin-right: auto; }
        
        /* Filter Bar */
        .filter-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: flex-end; }
        .filter-bar .form-group { margin-bottom: 0; min-width: 140px; flex: 1; max-width: 200px; }
        .filter-bar .form-label { font-size: 11px; font-weight: 600; color: var(--text-light); margin-bottom: 4px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-input, .form-select { width: 100%; padding: 9px 12px; font-size: 13px; border: 2px solid var(--border); border-radius: var(--radius-sm); background: var(--white); color: var(--text); outline: none; transition: var(--transition); font-family: inherit; }
        .form-input:focus, .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.08); }
        
        /* Card & Table */
        .card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow-sm); border: 1px solid var(--border); overflow: hidden; }
        .table-scroll { overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .data-table th { background: #f8fafc; padding: 12px 14px; text-align: left; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-light); border-bottom: 2px solid var(--border); white-space: nowrap; }
        .data-table td { padding: 11px 14px; border-bottom: 1px solid #f1f5f9; }
        .data-table tr:hover td { background: #f8fafc; }
        .data-table .row-checkbox { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }
        
        /* Status Badges */
        .status-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
        .status-badge.draft { background: #f1f5f9; color: #64748b; }
        .status-badge.proses { background: #fef3c7; color: #92400e; }
        .status-badge.terkirim { background: #dbeafe; color: #1d4ed8; }
        .status-badge.disetujui, .status-badge.approved, .status-badge.completed { background: #dcfce7; color: #15803d; }
        .status-badge.ditolak, .status-badge.rejected { background: #fef2f2; color: #b91c1c; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
        .status-dot.draft { background: #94a3b8; }
        .status-dot.proses { background: #f59e0b; }
        .status-dot.terkirim { background: #2563eb; }
        .status-dot.disetujui { background: #16a34a; }
        .status-dot.ditolak { background: #dc2626; }
        
        /* Table Footer */
        .table-footer { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-top: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
        .table-info { font-size: 12px; color: var(--text-light); }
        .table-pagination { display: flex; gap: 4px; }
        .btn-page { width: 32px; height: 32px; border: 1px solid var(--border); background: var(--white); border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
        .btn-page:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
        .btn-page.active { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-page:disabled { opacity: 0.4; cursor: not-allowed; }
        .page-ellipsis { padding: 0 4px; color: #94a3b8; }
        
        /* Quick View Panel */
        .qv-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1090; display: none; }
        .qv-overlay.visible { display: block; }
        .qv-panel { position: fixed; right: 0; top: 0; width: 420px; height: 100vh; background: white; box-shadow: -4px 0 30px rgba(0,0,0,0.2); z-index: 1100; transform: translateX(100%); transition: transform 0.35s ease; overflow-y: auto; }
        .qv-panel.open { transform: translateX(0); }
        .qv-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: white; z-index: 1; }
        .qv-header h3 { font-size: 16px; margin: 0; }
        .qv-close { width: 32px; height: 32px; border: none; background: #f1f5f9; border-radius: 6px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        .qv-close:hover { background: #e2e8f0; }
        .qv-body { padding: 20px; }
        .qv-body table { width: 100%; font-size: 13px; }
        .qv-body table td { padding: 6px 0; vertical-align: top; }
        .qv-body table td:first-child { color: var(--text-light); width: 100px; font-weight: 500; }
        
        /* Confirm Dialog */
        .confirm-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9998; align-items: center; justify-content: center; }
        .confirm-overlay.active { display: flex; }
        .confirm-dialog { background: white; border-radius: var(--radius); padding: 24px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.2); animation: modalIn 0.3s; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        /* Toast */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast { padding: 12px 20px; border-radius: 10px; color: white; font-size: 13px; font-weight: 500; box-shadow: 0 10px 25px rgba(0,0,0,0.15); animation: slideInRight 0.3s; max-width: 380px; display: flex; align-items: center; gap: 10px; }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
        .toast-warning { background: var(--warning); color: #1e293b; }
        .toast-info { background: var(--info); }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        /* Empty State */
        .empty-state { text-align: center; padding: 40px; color: #94a3b8; }
        .empty-state i { font-size: 40px; display: block; margin-bottom: 12px; }
        
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-content { margin-left: 0; padding: 16px; }
            .filter-bar { flex-direction: column; }
            .filter-bar .form-group { max-width: none; }
            .qv-panel { width: 100%; }
            .table-footer { flex-direction: column; }
        }
        
        @media print {
            .sidebar, .toast-container, .confirm-overlay, .qv-panel, .qv-overlay,
            .bulk-actions, .filter-bar, .btn, .row-checkbox { display: none !important; }
            .main-content { margin-left: 0 !important; }
        }
    </style>
</head>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand"><i class="fas fa-archive"></i><span>E-Arsip Digital</span></div>
        <nav class="sidebar-nav">

    <!-- Main -->
    <main class="main-content">
        <div class="page-header">
            <div>
                <h2>Daftar Surat Keluar</h2>

        <div class="filter-bar">

            </div>
            <div class="form-group">

                <select class="form-select" id="filter-status"><option value="">Semua</option><option value="draft">Draft</option><option value="proses">Proses</option><option value="terkirim">Terkirim</option><option value="disetujui">Disetujui</option><option value="completed">Selesai</option><option value="ditolak">Ditolak</option></select>

                <select class="form-select" id="filter-jenis"><option value="">Semua</option><option value="biasa">Biasa</option><option value="penting">Penting</option><option value="rahasia">Rahasia</option><option value="segera">Segera</option></select>

        <!-- Table -->

                        </tr></thead>
                        <tbody id="table-body"><tr><td colspan="8" style="text-align:center;padding:30px;">Memuat data...</td></tr></tbody>
                    </table>
                </div>
            </div>
            <div class="table-footer">

    <script src="../../config/config.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    
    <script>
    (function() {
        'use strict';
        
        // CSRF Token
        var csrfToken = (function() {
            var t = localStorage.getItem('csrf_token');
            if (!t) { var a = new Uint32Array(8); crypto.getRandomValues(a); t = Array.from(a, function(d) { return ('0'+d.toString(16)).slice(-2); }).join(''); localStorage.setItem('csrf_token', t); }
            return t;
        })();
        
        // Sanitization
        function sanitize(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function sanitizePlain(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;'); }
        
        // State
        var state = { suratList: [], selectedIds: {}, currentPage: 1, totalPages: 1, totalItems: 0, isLoading: false, confirmCallback: null };
        
        // Auth
        function checkAuth() {
            if (window.EArsip && window.EArsip.Auth && window.EArsip.Auth.isAuthenticated) return true;
            try { var s = localStorage.getItem('auth_session'); if (s) { var d = JSON.parse(s); if (d.user && d.expiresAt && Date.now() < d.expiresAt) return true; } } catch(e) {}
            window.location.href = '../../login.html?message=unauthorized'; return false;
        }
        
        // Toast
        function showToast(msg, type) {
            var c = document.getElementById('toast-container'); if (!c) return;
            var t = document.createElement('div'); t.className = 'toast toast-' + (type||'info'); t.textContent = sanitizePlain(msg); c.appendChild(t);
            setTimeout(function() { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(function() { t.remove(); }, 300); }, 4000);
        }
        
        // Confirm Dialog
        function showConfirm(title, msg, cb) {
            document.getElementById('confirm-title').textContent = sanitizePlain(title);
            document.getElementById('confirm-message').textContent = sanitizePlain(msg);
            document.getElementById('confirm-overlay').classList.add('active');
            state.confirmCallback = cb;
        }
        function hideConfirm() { document.getElementById('confirm-overlay').classList.remove('active'); state.confirmCallback = null; }
        
        // Format
        function formatDate(s) { if (!s) return '-'; try { var d = new Date(s); if (isNaN(d.getTime())) return s; return d.toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' }); } catch(e) { return s; } }
        function timeAgo(s) { if (!s) return '-'; try { var d = new Date(s); var diff = Math.floor((Date.now()-d.getTime())/1000); if (diff<60) return 'Baru saja'; if (diff<3600) return Math.floor(diff/60)+'m'; if (diff<86400) return Math.floor(diff/3600)+'j'; if (diff<604800) return Math.floor(diff/86400)+'h'; return formatDate(s); } catch(e) { return s; } }
        function formatStatus(st) { var m = { draft:'Draft', proses:'Proses', terkirim:'Terkirim', disetujui:'Disetujui', approved:'Disetujui', completed:'Selesai', ditolak:'Ditolak', rejected:'Ditolak' }; return m[st] || st || '-'; }
        function statusBadgeClass(st) {
            var c = { draft:'draft', proses:'proses', terkirim:'terkirim', disetujui:'disetujui', approved:'disetujui', completed:'disetujui', ditolak:'ditolak', rejected:'ditolak' };
            return c[st] || 'draft';
        }
        
        // Debounce
        function debounce(fn, ms) { var t; return function() { clearTimeout(t); t = setTimeout(fn, ms); }; }
        
        // ============ DATA LOADING ============
        function loadData() {
            if (state.isLoading) return; state.isLoading = true;
            
            var params = {
                action: 'getSuratKeluar',
                page: state.currentPage, limit: 15,
                search: document.getElementById('search-input').value.trim(),
                status: document.getElementById('filter-status').value,
                jenis: document.getElementById('filter-jenis').value,
                date: document.getElementById('filter-date').value
            };
            
            if (window.EArsip && window.EArsip.Api) {
                window.EArsip.Api.get('surat-keluar', params).then(function(r) {
                    state.isLoading = false;
                    if (r && r.data) { state.suratList = r.data.data || r.data; state.totalPages = r.data.totalPages || 1; state.totalItems = r.data.total || state.suratList.length; }
                    else { state.suratList = []; state.totalPages = 1; state.totalItems = 0; }
                    render();
                }).catch(function() { state.isLoading = false; loadSampleData(); });
            } else { state.isLoading = false; loadSampleData(); }
        }
        
        function loadSampleData() {
            state.suratList = [
                { id: 'SK001', nomor_surat: '001/K.UM/FIKOM/VII/2024', perihal: 'Undangan Rapat Koordinasi', tujuan: 'Kaprodi TI', tanggal_surat: '2024-07-15', jenis: 'biasa', status: 'disetujui', createdAt: new Date().toISOString() },
                { id: 'SK002', nomor_surat: '002/K.KEU/FIKOM/VII/2024', perihal: 'Permohonan Anggaran Workshop', tujuan: 'Wadek II', tanggal_surat: '2024-07-14', jenis: 'penting', status: 'proses', createdAt: new Date().toISOString() },
                { id: 'SK003', nomor_surat: '003/K.UM/FIKOM/VII/2024', perihal: 'Pemberitahuan Jadwal Ujian', tujuan: 'Mahasiswa', tanggal_surat: '2024-07-13', jenis: 'biasa', status: 'draft', createdAt: new Date().toISOString() },
                { id: 'SK004', nomor_surat: '004/RHS/FIKOM/VII/2024', perihal: 'Laporan Keuangan Internal', tujuan: 'Dekan', tanggal_surat: '2024-07-12', jenis: 'rahasia', status: 'ditolak', createdAt: new Date().toISOString() }
            ];
            state.totalPages = 1; state.totalItems = state.suratList.length;
            render();
        }
        
        // ============ RENDERING ============
        function render() { renderTable(); renderPagination(); document.getElementById('table-info').textContent = 'Menampilkan ' + state.suratList.length + ' dari ' + state.totalItems + ' surat'; }
        
        function renderTable() {
            var tbody = document.getElementById('table-body');
            if (state.suratList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><i class="fas fa-envelope-open-text"></i><p style="font-size:15px;font-weight:500;">Tidak ada surat keluar</p><p style="font-size:13px;">' + (document.getElementById('search-input').value ? 'Tidak ada hasil yang cocok' : 'Belum ada surat yang dibuat') + '</p><a href="form.html" class="btn btn-primary btn-sm" style="margin-top:12px;">Buat Surat Baru</a></div></td></tr>';
                return;
            }
            
            tbody.innerHTML = state.suratList.map(function(s) {
                var sid = sanitizePlain(s.id || '');
                var isSel = !!state.selectedIds[sid];
                return '<tr>' +
                    '<td><input type="checkbox" class="row-checkbox" data-id="' + sid + '" ' + (isSel?'checked':'') + '></td>' +
                    '<td><strong>' + sanitize(s.nomor_surat || '-') + '</strong></td>' +
                    '<td>' + sanitize(s.perihal || '-') + '</td>' +
                    '<td>' + sanitize(s.tujuan || '-') + '</td>' +
                    '<td>' + formatDate(s.tanggal_surat || s.createdAt) + '</td>' +
                    '<td><span class="badge" style="font-size:10px;padding:2px 8px;border-radius:10px;background:' + (s.jenis==='rahasia'?'#fef2f2':s.jenis==='penting'?'#fef3c7':'#dbeafe') + ';color:' + (s.jenis==='rahasia'?'#dc2626':s.jenis==='penting'?'#d97706':'#2563eb') + ';">' + sanitize(s.jenis||'Biasa') + '</span></td>' +
                    '<td><span class="status-badge ' + statusBadgeClass(s.status) + '"><span class="status-dot ' + statusBadgeClass(s.status) + '"></span>' + formatStatus(s.status) + '</span></td>' +
                    '<td><div style="display:flex;gap:2px;">' +
                        '<button class="btn-action" data-qv="' + sid + '" title="Lihat"><i class="fas fa-eye" style="color:#2563eb;"></i></button>' +
                        '<a href="preview.html?id=' + sid + '" class="btn-action" title="Preview"><i class="fas fa-file-alt" style="color:#16a34a;"></i></a>' +
                        (s.status === 'draft' ? '<a href="form.html?edit=' + sid + '" class="btn-action" title="Edit"><i class="fas fa-edit" style="color:#d97706;"></i></a>' : '') +
                        (s.status === 'disetujui' || s.status === 'completed' ? '<a href="generate.html?id=' + sid + '" class="btn-action" title="Generate"><i class="fas fa-cog" style="color:#9333ea;"></i></a>' : '') +
                        '<button class="btn-action" data-del="' + sid + '" title="Hapus"><i class="fas fa-trash" style="color:#dc2626;"></i></button>' +
                    '</div></td>' +
                '</tr>';
            }).join('');
            
            // Attach events
            tbody.querySelectorAll('.row-checkbox').forEach(function(cb) { cb.addEventListener('change', function() { toggleRow(this.dataset.id, this.checked); }); });
            tbody.querySelectorAll('[data-qv]').forEach(function(b) { b.addEventListener('click', function() { quickView(this.dataset.qv); }); });
            tbody.querySelectorAll('[data-del]').forEach(function(b) {
                b.addEventListener('click', function() {
                    var id = this.dataset.del;
                    var s = state.suratList.find(function(x) { return x.id === id; });
                    var name = s ? (s.nomor_surat || s.perihal || id) : id;
                    showConfirm('Hapus Surat', 'Hapus surat <strong>' + sanitize(name) + '</strong>?', function() { deleteSurat(id); });
                });
            });
        }
        
        function renderPagination() {
            var c = document.getElementById('pagination');
            if (state.totalPages <= 1) { c.innerHTML = ''; return; }
            var h = '<button class="btn-page" ' + (state.currentPage===1?'disabled':'') + ' data-page="' + (state.currentPage-1) + '"><i class="fas fa-chevron-left"></i></button>';
            for (var i = 1; i <= state.totalPages; i++) {
                if (i === 1 || i === state.totalPages || Math.abs(i - state.currentPage) <= 1) h += '<button class="btn-page' + (i===state.currentPage?' active':'') + '" data-page="' + i + '">' + i + '</button>';
                else if (Math.abs(i - state.currentPage) === 2) h += '<span class="page-ellipsis">...</span>';
            }
            h += '<button class="btn-page" ' + (state.currentPage===state.totalPages?'disabled':'') + ' data-page="' + (state.currentPage+1) + '"><i class="fas fa-chevron-right"></i></button>';
            c.innerHTML = h;
            c.querySelectorAll('.btn-page[data-page]').forEach(function(b) { b.addEventListener('click', function() { state.currentPage = parseInt(this.dataset.page); loadData(); window.scrollTo({ top: 0, behavior: 'smooth' }); }); });
        }
        
        // ============ SELECTION ============
        function toggleRow(id, checked) { if (checked) state.selectedIds[id] = true; else delete state.selectedIds[id]; updateBulkUI(); }
        function selectAll(checked) {
            if (checked) state.suratList.forEach(function(s) { state.selectedIds[s.id] = true; });
            else state.selectedIds = {};
            updateBulkUI(); renderTable();
        }
        function clearSelection() { state.selectedIds = {}; document.getElementById('select-all').checked = false; updateBulkUI(); renderTable(); }
        function updateBulkUI() {
            var count = Object.keys(state.selectedIds).length;
            var bar = document.getElementById('bulk-actions');
            document.getElementById('bulk-count').textContent = count + ' surat dipilih';
            bar.classList.toggle('visible', count > 0);
        }
        
        // ============ ACTIONS ============
        function deleteSurat(id) {
            if (state.isLoading) return; state.isLoading = true;
            var p = { action: 'deleteSurat', id: id, csrf_token: csrfToken };
            if (window.EArsip && window.EArsip.Api) {
                window.EArsip.Api.post('surat-keluar/delete', p).then(function(r) { state.isLoading = false; if (r&&r.success) { delete state.selectedIds[id]; loadData(); showToast('Surat dihapus', 'success'); } else showToast(r?.message||'Gagal', 'error'); }).catch(function(e) { state.isLoading = false; showToast('Error: '+sanitizePlain(e.message), 'error'); });
            } else { setTimeout(function() { state.isLoading = false; delete state.selectedIds[id]; loadData(); showToast('Surat dihapus', 'success'); }, 300); }
        }
        
        function bulkDelete() {
            var ids = Object.keys(state.selectedIds);
            if (!ids.length) return showToast('Pilih surat dulu', 'warning');
            showConfirm('Hapus Surat Terpilih', 'Hapus <strong>' + ids.length + ' surat</strong> terpilih?', function() {
                if (state.isLoading) return; state.isLoading = true;
                var p = { action: 'bulkDelete', ids: ids, csrf_token: csrfToken };
                if (window.EArsip && window.EArsip.Api) {
                    window.EArsip.Api.post('surat-keluar/bulk-delete', p).then(function(r) { state.isLoading = false; if (r&&r.success) { state.selectedIds = {}; loadData(); showToast(ids.length+' surat dihapus', 'success'); } else showToast(r?.message||'Gagal', 'error'); }).catch(function(e) { state.isLoading = false; showToast('Error', 'error'); });
                } else { setTimeout(function() { state.isLoading = false; state.selectedIds = {}; loadData(); showToast(ids.length+' surat dihapus', 'success'); }, 400); }
            });
        }
        
        function bulkExport() {
            var ids = Object.keys(state.selectedIds);
            if (!ids.length) return showToast('Pilih surat dulu', 'warning');
            // Simple CSV export
            var selected = state.suratList.filter(function(s) { return ids.indexOf(s.id) !== -1; });
            var csv = 'No,Surat,Perihal,Tujuan,Tanggal,Jenis,Status\n';
            csv += selected.map(function(s,i) { return [i+1, s.nomor_surat||'', s.perihal||'', s.tujuan||'', s.tanggal_surat||'', s.jenis||'', s.status||''].join(','); }).join('\n');
            var blob = new Blob(['\ufeff'+csv], { type: 'text/csv;charset=utf-8;' });
            var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'surat-keluar-export-' + Date.now() + '.csv';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            showToast('Export berhasil', 'success');
        }
        
        // ============ QUICK VIEW ============
        function quickView(id) {
            var s = state.suratList.find(function(x) { return x.id === id; });
            if (!s) { // Fetch from API
                if (window.EArsip && window.EArsip.Api) {
                    window.EArsip.Api.get('surat-keluar/detail', { id: id }).then(function(r) {
                        if (r && r.data) renderQuickView(r.data);
                        else showToast('Data tidak ditemukan', 'warning');
                    }).catch(function() { showToast('Gagal memuat detail', 'error'); });
                } else { renderQuickView(s || { id: id, nomor_surat: '-', perihal: 'Sample', tujuan: '-', status: 'draft' }); }
            } else { renderQuickView(s); }
        }
        
        function renderQuickView(s) {
            document.getElementById('qv-body').innerHTML = '<table>' +
                '<tr><td>No. Surat</td><td><strong>' + sanitize(s.nomor_surat||'-') + '</strong></td></tr>' +
                '<tr><td>Perihal</td><td>' + sanitize(s.perihal||'-') + '</td></tr>' +
                '<tr><td>Tanggal</td><td>' + formatDate(s.tanggal_surat||s.createdAt) + '</td></tr>' +
                '<tr><td>Jenis</td><td>' + sanitize(s.jenis||'-') + '</td></tr>' +
                '<tr><td>Sifat</td><td>' + sanitize(s.sifat||'-') + '</td></tr>' +
                '<tr><td>Tujuan</td><td>' + sanitize(s.tujuan||'-') + '</td></tr>' +
                '<tr><td>Status</td><td><span class="status-badge ' + statusBadgeClass(s.status) + '">' + formatStatus(s.status) + '</span></td></tr>' +
                '<tr><td>Dibuat</td><td>' + timeAgo(s.createdAt) + '</td></tr>' +
            '</table>' +
            '<div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;">' +
                '<a href="preview.html?id=' + sanitizePlain(s.id) + '" class="btn btn-primary btn-sm"><i class="fas fa-eye"></i> Preview</a>' +
                (s.status === 'draft' ? '<a href="form.html?edit=' + sanitizePlain(s.id) + '" class="btn btn-outline btn-sm"><i class="fas fa-edit"></i> Edit</a>' : '') +
                (s.status === 'disetujui' || s.status === 'completed' ? '<a href="generate.html?id=' + sanitizePlain(s.id) + '" class="btn btn-outline btn-sm"><i class="fas fa-cog"></i> Generate</a>' : '') +
                '<a href="approval.html?id=' + sanitizePlain(s.id) + '" class="btn btn-outline btn-sm"><i class="fas fa-check-double"></i> Approval</a>' +
            '</div>';
            
            document.getElementById('qv-panel').classList.add('open');
            document.getElementById('qv-overlay').classList.add('visible');
        }
        
        function closeQuickView() {
            document.getElementById('qv-panel').classList.remove('open');
            document.getElementById('qv-overlay').classList.remove('visible');
        }
        
        // ============ LOGOUT ============
        function handleLogout() {
            if (!confirm('Yakin logout?')) return;
            try { if (window.EArsip && window.EArsip.Auth) window.EArsip.Auth.logout(); } catch(e) {}
            localStorage.removeItem('auth_session'); localStorage.removeItem('auth_token');
            window.location.href = '../../login.html?message=logged_out';
        }
        window.handleLogout = handleLogout;
        
        // ============ INIT ============
        function init() {
            if (!checkAuth()) return;
            setTimeout(function() { var l = document.getElementById('loading-screen'); if (l) l.classList.add('hidden'); }, 300);
            
            document.getElementById('refresh-btn').addEventListener('click', function() { loadData(); showToast('Data diperbarui', 'info'); });
            document.getElementById('apply-filter').addEventListener('click', function() { state.currentPage = 1; loadData(); });
            document.getElementById('reset-filter').addEventListener('click', function() { document.getElementById('search-input').value = ''; document.getElementById('filter-status').value = ''; document.getElementById('filter-jenis').value = ''; document.getElementById('filter-date').value = ''; state.currentPage = 1; loadData(); });
            document.getElementById('search-input').addEventListener('input', debounce(function() { state.currentPage = 1; loadData(); }, 400));
            document.getElementById('select-all').addEventListener('change', function() { selectAll(this.checked); });
            document.getElementById('clear-selection').addEventListener('click', clearSelection);
            document.getElementById('bulk-delete-btn').addEventListener('click', bulkDelete);
            document.getElementById('bulk-export-btn').addEventListener('click', bulkExport);
            document.getElementById('qv-close').addEventListener('click', closeQuickView);
            document.getElementById('qv-overlay').addEventListener('click', closeQuickView);
            document.getElementById('confirm-cancel').addEventListener('click', hideConfirm);
            document.getElementById('confirm-ok').addEventListener('click', function() { if (state.confirmCallback) state.confirmCallback(); hideConfirm(); });
            document.getElementById('confirm-overlay').addEventListener('click', function(e) { if (e.target === this) hideConfirm(); });
            document.addEventListener('keydown', function(e) { if (e.key === 'Escape') { closeQuickView(); hideConfirm(); } });
            
            loadData();
        }
        
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
    })();
    </script>
</body>
</html>
