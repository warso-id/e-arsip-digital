        async function loadDrafts() {
            try {
                const response = await apiService.get('/api/surat-keluar/drafts');
                drafts = response.data || [];
                renderDrafts();
            } catch (error) {
                logger.error('Failed to load drafts', error);
                drafts = [];
                renderDrafts();
            }
        }
        
        function renderDrafts() {
            const container = document.getElementById('draft-list');
            
            if (drafts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-file-alt"></i>
                        <h3>Tidak Ada Draft</h3>
                        <p>Surat yang disimpan sebagai draft akan muncul di sini</p>
                        <a href="/surat-keluar/form.html" class="btn btn-primary btn-sm" style="margin-top:16px;">
                            Buat Surat Baru
                        </a>
                    </div>`;
                return;
            }
            
            container.innerHTML = drafts.map(d => `
                <div class="draft-card" onclick="window.location.href='/surat-keluar/form.html?edit=${d.id}'">
                    <div class="draft-icon">
                        <i class="fas fa-file-alt"></i>
                    </div>
                    <div class="draft-info">
                        <h4>${d.perihal || 'Tanpa Perihal'}</h4>
                        <div class="meta">
                            ${d.tujuan ? `<span><i class="fas fa-building"></i> ${d.tujuan}</span> &nbsp;` : ''}
                            <span><i class="fas fa-clock"></i> ${utils.timeAgo(d.updatedAt || d.createdAt)}</span>
                        </div>
                    </div>
                    <span class="draft-status">Draft</span>
                    <div class="draft-actions" onclick="event.stopPropagation();">
                        <a href="/surat-keluar/form.html?edit=${d.id}" class="btn btn-sm btn-outline" title="Edit">
                            <i class="fas fa-edit"></i>
                        </a>
                        <button class="btn btn-sm btn-outline" title="Hapus" style="color:#dc2626;" 
                            onclick="deleteDraft('${d.id}')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        async function deleteDraft(id) {
            if (!confirm('Hapus draft ini?')) return;
            
            try {
                await apiService.delete(`/api/surat-keluar/drafts/${id}`);
                notifications.success('Draft dihapus');
                drafts = drafts.filter(d => d.id !== id);
                renderDrafts();
            } catch (error) {
                notifications.error('Gagal menghapus draft');
            }
        }
        
        window.deleteDraft = deleteDraft;
    </script>
